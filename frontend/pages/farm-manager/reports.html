<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("pinevision_settings") || "{}",
          );
          if (s.theme === "dark")
            document.documentElement.classList.add("dark-mode");
        } catch (e) {}
      })();
    </script>
    <title>Reports - PineVision</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <style>
      .rp-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--grid-gap);
        margin-bottom: var(--space-2xl);
      }
      .mc {
        transition:
          box-shadow var(--transition-fast),
          transform var(--transition-fast);
        cursor: default;
      }
      .mc:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
      @media (max-width: 960px) {
        .rp-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 580px) {
        .rp-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- ── Sidebar ─────────────────────────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-logo">
            <img
              src="/frontend/assets/images/pinevision-logo.svg"
              alt="PineVision"
              class="sidebar-logo-img"
            />
          </div>
          <div class="sidebar-brand-text">
            <div class="sidebar-brand-name">PineVision</div>
            <div class="sidebar-brand-tagline">Farm Manager Panel</div>
          </div>
        </div>

        <button
          class="sidebar-collapse-btn"
          onclick="app.toggleSidebar()"
          aria-label="Toggle sidebar"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15,18 9,12 15,6" />
          </svg>
          <span class="nav-link-text">Collapse sidebar</span>
        </button>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-section-title">Main</div>
            <ul class="nav-links">
              <li>
                <a
                  href="dashboard.html"
                  class="nav-link"
                  data-tooltip="Dashboard"
                >
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-dashboard.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Dashboard</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">Monitoring</div>
            <ul class="nav-links">
              <li>
                <a href="users.html" class="nav-link" data-tooltip="Users">
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-users.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Users</span>
                </a>
              </li>
              <li>
                <a
                  href="auditlogs.html"
                  class="nav-link"
                  data-tooltip="Audit Logs"
                >
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-clipboard.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Audit Logs</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">Operations</div>
            <ul class="nav-links">
              <li>
                <a
                  href="flights-scans.html"
                  class="nav-link"
                  data-tooltip="Flights &amp; Scans"
                >
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-flights.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Flights &amp; Scans</span>
                </a>
              </li>
              <li>
                <a href="alerts.html" class="nav-link" data-tooltip="Alerts">
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-bell.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Alerts</span>
                  <span
                    class="nav-badge"
                    id="nav-badge-alerts"
                    style="display: none"
                  ></span>
                </a>
              </li>
              <li>
                <a
                  href="reports.html"
                  class="nav-link active"
                  data-tooltip="Reports"
                >
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-reports.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Reports</span>
                </a>
              </li>
            </ul>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">System</div>
            <ul class="nav-links">
              <li>
                <a
                  href="settings.html"
                  class="nav-link"
                  data-tooltip="Settings"
                >
                  <span class="nav-link-icon"
                    ><img
                      src="/frontend/assets/icons/nav-cog.svg"
                      alt=""
                      width="18"
                      height="18"
                  /></span>
                  <span class="nav-link-text">Settings</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">A</div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name">Admin</div>
              <div class="sidebar-user-role">admin</div>
            </div>
          </div>
          <button class="btn-logout" onclick="openLogoutModal()">
            <img src="/frontend/assets/icons/logout.svg" alt="" width="16" />
            <span class="logout-text">Logout</span>
          </button>
        </div>
      </aside>

      <!-- ── Main Content ─────────────────────────────────────────────── -->
      <main class="main-content">
        <div
          class="page-container"
          style="
            padding: var(--page-padding);
            max-width: var(--page-max-width);
            margin: 0 auto;
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              margin-bottom: var(--space-2xl);
            "
          >
            <div>
              <h1 class="page-title d-flex align-items-center gap-2">
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="color: var(--green); flex-shrink: 0"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  />
                  <polyline points="14 2 14 8 20 8" />
                  <line x1="16" y1="13" x2="8" y2="13" />
                  <line x1="16" y1="17" x2="8" y2="17" />
                  <polyline points="10 9 9 9 8 9" /></svg
                >Reports
              </h1>
              <p class="page-subtitle">
                Generated scan reports and analytics summaries
              </p>
            </div>
            <button
              class="btn btn-primary btn-sm"
              onclick="utils.showToast('Generating report…', 'success')"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Generate Report
            </button>
          </div>

          <div class="rp-grid" id="rp-metrics"></div>

          <div id="rp-content"></div>
        </div>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/app.js"></script>
    <script>
      if (!auth.requireFarmManager()) {
      }

      window.initPage = function () {
        loadMetrics();
        loadReports();
      };

      function loadMetrics() {
        var scans = data.getScans ? data.getScans() : [];
        var alerts = data.getAlerts ? data.getAlerts() : [];
        var users = data.getUsers ? data.getUsers() : [];

        var colorMap = {
          green: { fg: "var(--green)", bg: "var(--green-bg)" },
          amber: { fg: "var(--amber)", bg: "var(--amber-bg)" },
          "": {
            fg: "var(--color-text-secondary)",
            bg: "var(--color-background-tertiary)",
          },
        };
        var cards = [
          {
            label: "Total Reports",
            value: scans.length,
            sub: "Scan reports generated",
            color: "green",
            icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
          },
          {
            label: "Active Alerts",
            value: alerts.filter(function (a) {
              return !a.resolved;
            }).length,
            sub: "Requiring action",
            color: "amber",
            icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
          },
          {
            label: "Client Coverage",
            value: users.filter(function (u) {
              return u.role === "client";
            }).length,
            sub: "Clients with data",
            color: "",
            icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
          },
        ];

        var html = "";
        cards.forEach(function (c) {
          var cm = colorMap[c.color] || colorMap[""];
          html +=
            '<div class="mc ' +
            c.color +
            '">' +
            '<div class="mc-icon"><div style="width:32px;height:32px;border-radius:var(--radius-sm);background:' +
            cm.bg +
            ";display:flex;align-items:center;justify-content:center;color:" +
            cm.fg +
            ';">' +
            c.icon +
            "</div></div>" +
            '<div class="mc-label">' +
            c.label +
            "</div>" +
            '<div class="mc-val">' +
            c.value +
            "</div>" +
            '<div class="mc-sub">' +
            c.sub +
            "</div>" +
            "</div>";
        });
        document.getElementById("rp-metrics").innerHTML = html;
      }

      function loadReports() {
        var scans = data.getScans ? data.getScans() : [];
        if (!scans.length) {
          document.getElementById("rp-content").innerHTML =
            '<div class="card"><div class="empty-state">' +
            '<div class="empty-state-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>' +
            '<div class="empty-state-title">No Reports Yet</div>' +
            '<div class="empty-state-text">Reports will appear here after scans are completed</div>' +
            "</div></div>";
          return;
        }

        var html =
          '<div class="tcard">' +
          '<div class="thead-row"><h3 class="thead-title">Scan Reports</h3>' +
          '<span style="font-size:11px;color:var(--color-text-secondary);">' +
          scans.length +
          " reports</span></div>" +
          '<div class="twrap"><table><thead><tr>' +
          "<th>Date</th><th>Title</th><th>Operator</th><th>Blocks</th><th>Duration</th><th>Bearing Rate</th><th>Actions</th>" +
          "</tr></thead><tbody>";

        scans.forEach(function (s) {
          var bearColor =
            s.bearing >= 75
              ? "var(--green)"
              : s.bearing >= 60
                ? "var(--amber)"
                : "var(--red)";
          var bearBadge =
            s.bearing >= 75
              ? '<span class="badge good"><span class="bdot"></span>' +
                s.bearing.toFixed(1) +
                "%</span>"
              : s.bearing >= 60
                ? '<span class="badge warn"><span class="bdot"></span>' +
                  s.bearing.toFixed(1) +
                  "%</span>"
                : '<span class="badge crit"><span class="bdot"></span>' +
                  s.bearing.toFixed(1) +
                  "%</span>";
          html +=
            "<tr>" +
            '<td style="font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);">' +
            s.day +
            " " +
            s.month +
            "</td>" +
            '<td style="font-weight:var(--font-weight-medium);">' +
            (s.title || "—") +
            "</td>" +
            '<td style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">' +
            (s.operator || "—") +
            "</td>" +
            '<td style="font-size:var(--font-size-sm);text-align:center;">' +
            (s.blocks || "—") +
            "</td>" +
            '<td style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">' +
            (s.duration || "—") +
            "</td>" +
            "<td>" +
            bearBadge +
            "</td>" +
            '<td><button class="btn btn-secondary btn-sm" style="font-size:11px;" onclick="utils.showToast(\'Downloading report…\', \'success\')">Download</button></td>' +
            "</tr>";
        });

        html += "</tbody></table></div></div>";
        document.getElementById("rp-content").innerHTML = html;
      }

      function openLogoutModal() { auth.confirmLogout(); }
      function closeLogoutModal() {
        document.getElementById("logout-modal").style.display = "none";
      }
    </script>

    <!-- Logout Confirmation Modal -->
    <div
      id="logout-modal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
      "
    >
      <!-- Backdrop -->
      <div
        onclick="closeLogoutModal()"
        style="
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.45);
          backdrop-filter: blur(2px);
        "
      ></div>
      <!-- Dialog -->
      <div
        style="
          position: relative;
          background: var(--color-background-primary);
          border: 1px solid var(--color-border-secondary);
          border-radius: var(--radius-lg);
          padding: var(--space-2xl);
          width: 360px;
          max-width: 90vw;
          box-shadow: var(--shadow-md);
          text-align: center;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--red-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-lg);
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--red)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </div>
        <h3
          style="
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
            margin-bottom: var(--space-sm);
          "
        >
          Confirm Logout
        </h3>
        <p
          style="
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-xl);
          "
        >
          Are you sure you want to log out of your session?
        </p>
        <div
          style="display: flex; gap: var(--space-md); justify-content: center"
        >
          <button
            onclick="closeLogoutModal()"
            class="btn btn-secondary"
            style="flex: 1"
          >
            Cancel
          </button>
          <button
            onclick="auth.logout()"
            class="btn btn-danger"
            style="
              flex: 1;
              background: var(--red-mid);
              color: #fff;
              border-color: var(--red-mid);
            "
          >
            Yes, Logout
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
