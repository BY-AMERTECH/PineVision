          );
          if (s.theme === "dark")
            document.documentElement.classList.add("dark-mode");
        } catch (e) {}
      })();

    <style>
      .rp-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--grid-gap);
        margin-bottom: var(--space-2xl);
      }
      .mc {
        transition:
          box-shadow var(--transition-fast),
          transform var(--transition-fast);
        cursor: default;
      }
      .mc:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
      @media (max-width: 960px) {
        .rp-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 580px) {
        .rp-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Live sync indicator (shared pattern with Flights & Scans) ── */
      .fs-live-dot {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: var(--font-weight-medium);
        color: var(--muted);
        font-family: var(--font-mono);
      }
      .fs-live-dot .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green-500);
        box-shadow: 0 0 0 3px var(--green-bg);
        flex-shrink: 0;
        animation: fs-pulse 2s ease-in-out infinite;
      }
      .fs-live-dot.offline .dot {
        background: var(--red-mid);
        box-shadow: 0 0 0 3px var(--red-bg);
        animation: none;
      }
      @keyframes fs-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* ── Filter Panel ─────────────────────────────────────────── */
      .filter-panel {
        background-color: var(--surf);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }
      .filter-panel-title {
        font-size: var(--font-size-md);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: var(--space-lg);
      }
      .filter-field {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }
      .filter-field-label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }
      .filter-select,
      .filter-date {
        padding: var(--space-md);
        font-size: var(--font-size-base);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        transition: border-color var(--transition-fast);
        width: 100%;
      }
      .filter-select:focus,
      .filter-date:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-bg);
      }
      .filter-actions {
        display: flex;
        gap: var(--space-md);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--space-lg);
      }

      /* ── Report Results ───────────────────────────────────────── */
      .report-results { display: none; }
      .report-results.visible { display: block; }
      .report-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-lg);
        flex-wrap: wrap;
        gap: var(--space-md);
      }
      .report-title-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }
      .report-title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
      }
      .report-subtitle {
        font-size: var(--font-size-sm);
        color: var(--muted);
      }
      .export-actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
      .btn-export { position: relative; }
      .btn-export-label {
        position: absolute;
        top: -8px;
        right: -4px;
        font-size: 9px;
        font-weight: var(--font-weight-semibold);
        background-color: var(--amber-bg);
        color: var(--amber);
        padding: 1px 5px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--amber);
        white-space: nowrap;
      }

      .rp-table {
        width: 100%;
        table-layout: fixed;
      }
      .rp-table th,
      .rp-table td {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .rp-table col.c-block { width: 13%; }
      .rp-table col.c-section { width: 10%; }
      .rp-table col.c-operator { width: 17%; }
      .rp-table col.c-daf { width: 7%; }
      .rp-table col.c-area { width: 8%; }
      .rp-table col.c-bearing { width: 11%; }
      .rp-table col.c-nonbearing { width: 11%; }
      .rp-table col.c-nonviable { width: 11%; }
      .rp-table col.c-status { width: 12%; }
      .rp-table .ibar { gap: var(--space-xs); }
      .rp-table .it { flex: 0 1 48px; min-width: 24px; }
      .rp-table .ip { min-width: 38px; }

      @media (max-width: 580px) {
        .filter-panel { padding: var(--space-lg); }
        .rp-table { min-width: 720px; }
      }

    <script>
      if (!auth.requireFarmManager()) {
      }

      // ══════════════════════════════════════════════════════════════
      // Reports — live Firestore sync (farm-wide, all accounts)
      //
      // The report is generated from the live `blocks` collection (each
      // block's bearingPercent/nonBearingPercent/nonViable reflect its
      // most recent scan), joined against `users` for the flight
      // operator's name. The `scans` collection is joined separately to
      // count how many scan sessions fall inside the selected date
      // range, for the "Scans in Range" metric — a real link between the
      // report and the underlying scan history rather than a static
      // count. All three collections are onSnapshot listeners; if the
      // report panel is already open when new data arrives, it silently
      // re-renders with the fresh data.
      // ══════════════════════════════════════════════════════════════

      const RP_LIMIT = 300;

      let rpBlocksUnsub = null;
      let rpUsersUnsub = null;
      let rpScansUnsub = null;

      let rpBlocksLoaded = false;
      let rpUsersLoaded = false;
      let rpScansLoaded = false;

      let BLOCKS_RAW = [];   // [{id, blockName, section, userId, operatorName, ...}]
      let USERS_BY_ID = {};  // userId -> fullName
      let SCANS_RAW = [];    // [{id, blockId, startTime, ...}]
      let CURRENT_REPORT_BLOCKS = [];  // last filtered set rendered by generateReport(), used by exportReportCSV()

      window.initPage = function () {
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);
        document.getElementById("rp-date-to").value = today.toISOString().split("T")[0];
        document.getElementById("rp-date-from").value = monthAgo.toISOString().split("T")[0];

        attachListeners();
        window.addEventListener("pagehide", detachListeners);
        window.addEventListener("beforeunload", detachListeners);
      };

      // ── Live listeners ────────────────────────────────────────────

      function attachListeners() {
        detachListeners();
        setLiveStatus(true);
        document.getElementById("rp-status-placeholder").style.display = "block";
        document.getElementById("rp-status-placeholder").textContent = "Loading live farm data…";

        rpUsersUnsub = firebase
          .firestore()
          .collection("users")
          .limit(RP_LIMIT)
          .onSnapshot(
            function (snap) {
              USERS_BY_ID = {};
              snap.forEach(function (doc) {
                const d = doc.data();
                USERS_BY_ID[doc.id] = d.fullName || d.username || d.email || doc.id;
              });
              rpUsersLoaded = true;
              onDataChanged();
            },
            function (error) {
              console.error("❌ users listener error:", error);
              setLiveStatus(false);
            },
          );

        rpBlocksUnsub = firebase
          .firestore()
          .collection("blocks")
          .limit(RP_LIMIT)
          .onSnapshot(
            async function (snap) {
              BLOCKS_RAW = [];
              snap.forEach(function (doc) {
                const d = doc.data();
                BLOCKS_RAW.push({
                  id: doc.id,
                  activeCycleId: d.activeCycleId || null,
                  blockName: d.blockName || d.blockId || doc.id,
                  userId: d.userId || "",
                  section: d.section || "—",
                  area: typeof d.area === "number" ? d.area : parseFloat(d.area) || 0,
                  daf: typeof d.daf === "number" ? d.daf : parseInt(d.daf, 10) || 0,
                  bearing: d.bearingPercent || 0,
                  nonbearing: d.nonBearingPercent || 0,
                  nonViable: d.nonViable || 0,
                  totalScans: d.totalScans || 0,
                  plants: null,
                });
              });
              try {
                const latestCounts = await blockScanHistory.loadLatestPlantCounts(
                  BLOCKS_RAW.map((block) => block.id),
                  null,
                  Object.fromEntries(BLOCKS_RAW.map((block) => [block.id, block.activeCycleId])),
                );
                BLOCKS_RAW.forEach(function (block) {
                  block.plants = latestCounts.get(block.id) || 0;
                });
              } catch (scanError) {
                console.error("❌ Error loading latest completed plant counts:", scanError);
              }
              rpBlocksLoaded = true;
              setLiveStatus(true);
              onDataChanged();
            },
            function (error) {
              console.error("❌ blocks listener error:", error);
              rpBlocksLoaded = true;
              setLiveStatus(false);
              renderLoadError();
            },
          );

        rpScansUnsub = firebase
          .firestore()
          .collection("scans")
          .orderBy("startTime", "desc")
          .limit(RP_LIMIT)
          .onSnapshot(
            function (snap) {
              SCANS_RAW = [];
              snap.forEach(function (doc) {
                const d = doc.data();
                SCANS_RAW.push({
                  id: doc.id,
                  blockId: d.blockId || "",
                  startTime: d.startTime && typeof d.startTime.toDate === "function" ? d.startTime.toDate() : null,
                });
              });
              rpScansLoaded = true;
              onDataChanged();
            },
            function (error) {
              console.error("❌ scans listener error:", error);
              rpScansLoaded = true;
              onDataChanged();
            },
          );
      }

      function detachListeners() {
        [rpBlocksUnsub, rpUsersUnsub, rpScansUnsub].forEach(function (unsub) {
          if (typeof unsub === "function") {
            try {
              unsub();
            } catch (e) {
              /* no-op — already detached */
            }
          }
        });
        rpBlocksUnsub = null;
        rpUsersUnsub = null;
        rpScansUnsub = null;
      }

      function setLiveStatus(online) {
        const el = document.getElementById("rp-live-indicator");
        const label = document.getElementById("rp-live-label");
        if (!el || !label) return;
        el.classList.toggle("offline", !online);
        label.textContent = online ? "Live" : "Connection issue";
      }

      // Called whenever any of the three live collections resolve/update.
      function onDataChanged() {
        if (!rpBlocksLoaded || !rpUsersLoaded || !rpScansLoaded) return;

        document.getElementById("rp-status-placeholder").style.display = "none";
        populateFilterOptions();

        // If a report is already open, keep it live by silently
        // re-running the same filters against the fresh data.
        const results = document.getElementById("report-results");
        if (results.classList.contains("visible")) {
          generateReport();
        }
      }

      function renderLoadError() {
        document.getElementById("rp-status-placeholder").style.display = "block";
        document.getElementById("rp-status-placeholder").innerHTML =
          'Couldn\'t reach Firestore to load report data. ' +
          '<button class="btn btn-sm btn-secondary" onclick="attachListeners()"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Retry</button>';
      }

      // ── Filter dropdown population ──────────────────────────────

      function populateFilterOptions() {
        const blockSelect = document.getElementById("rp-filter-block");
        const operatorSelect = document.getElementById("rp-filter-operator");
        const currentBlock = blockSelect.value;
        const currentOperator = operatorSelect.value;

        const operatorBlocks = BLOCKS_RAW.map(function (b) {
          return Object.assign({}, b, { operatorName: USERS_BY_ID[b.userId] || b.userId || "Unassigned" });
        });

        blockSelect.innerHTML =
          '<option value="all">All Blocks</option>' +
          operatorBlocks
            .slice()
            .sort((a, b) => a.blockName.localeCompare(b.blockName))
            .map((b) => `<option value="${escapeHtml(b.id)}">${escapeHtml(b.blockName)} — ${escapeHtml(b.section)}</option>`)
            .join("");

        const operators = Array.from(new Set(operatorBlocks.map((b) => b.operatorName).filter(Boolean))).sort();
        operatorSelect.innerHTML =
          '<option value="all">All Users</option>' +
          operators.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");

        blockSelect.value = currentBlock || "all";
        operatorSelect.value = currentOperator || "all";
      }

      // ── Generate report ──────────────────────────────────────────

      function generateReport() {
        const blockFilter = document.getElementById("rp-filter-block").value;
        const operatorFilter = document.getElementById("rp-filter-operator").value;
        const statusFilter = document.getElementById("rp-filter-status").value;
        const dateFrom = document.getElementById("rp-date-from").value;
        const dateTo = document.getElementById("rp-date-to").value;

        let blocks = BLOCKS_RAW.map(function (b) {
          return Object.assign({}, b, { operatorName: USERS_BY_ID[b.userId] || b.userId || "Unassigned" });
        });

        if (blockFilter !== "all") blocks = blocks.filter((b) => b.id === blockFilter);
        if (operatorFilter !== "all") blocks = blocks.filter((b) => b.operatorName === operatorFilter);
        if (statusFilter !== "all") blocks = blocks.filter((b) => blockStatusClass(b) === statusFilter);

        // Join against the live scans collection: how many scan sessions,
        // for the blocks currently in this report, fall in the date range.
        const blockIds = new Set(blocks.map((b) => b.id));
        const fromTime = dateFrom ? new Date(dateFrom + "T00:00:00") : null;
        const toTime = dateTo ? new Date(dateTo + "T23:59:59") : null;
        const scansInRange = SCANS_RAW.filter(function (s) {
          if (!blockIds.has(s.blockId)) return false;
          if (!s.startTime) return false;
          if (fromTime && s.startTime < fromTime) return false;
          if (toTime && s.startTime > toTime) return false;
          return true;
        });

        const parts = [];
        if (dateFrom) parts.push("From " + dateFrom);
        if (dateTo) parts.push("To " + dateTo);
        if (blockFilter !== "all") {
          const b = BLOCKS_RAW.find((x) => x.id === blockFilter);
          parts.push("Block " + (b ? b.blockName : blockFilter));
        }
        if (operatorFilter !== "all") parts.push(operatorFilter);
        if (statusFilter !== "all") parts.push(statusLabel(statusFilter) + " only");

        document.getElementById("report-title-text").textContent = "Farm Performance Report";
        document.getElementById("report-subtitle-text").textContent =
          parts.length ? parts.join(" · ") : "All blocks · All users · All statuses";

        renderMetrics(blocks, scansInRange);
        renderTable(blocks);
        CURRENT_REPORT_BLOCKS = blocks;

        const results = document.getElementById("report-results");
        results.classList.add("visible");
      }

      /* ── Export CSV ────────────────────────────────────────────────
       * Reuses the same Blob/createObjectURL pattern as
       * admin/activity.html's exportCSV() — exports the report table
       * exactly as currently filtered/generated. */
      function exportReportCSV() {
        if (!CURRENT_REPORT_BLOCKS.length) {
          utils.showToast("Generate a report first.", "info");
          return;
        }
        const rows = [
          [
            "Block",
            "Section",
            "User",
            "Days After Flowering",
            "Area (ha)",
            "Bearing %",
            "Non-Bearing %",
            "Non-Viable %",
            "Status",
          ],
        ];
        CURRENT_REPORT_BLOCKS.forEach((block) => {
          rows.push([
            '"' + (block.blockName || "").replace(/"/g, '""') + '"',
            '"' + (block.section || "").replace(/"/g, '""') + '"',
            '"' + (block.operatorName || "").replace(/"/g, '""') + '"',
            block.daf,
            block.area,
            block.bearing.toFixed(1),
            block.nonbearing.toFixed(1),
            block.nonViable.toFixed(1),
            statusLabel(blockStatusClass(block)),
          ]);
        });
        const csv = rows.map((r) => r.join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pinevision-report-" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();
        URL.revokeObjectURL(url);
        utils.showToast("Exported " + CURRENT_REPORT_BLOCKS.length + " block" + (CURRENT_REPORT_BLOCKS.length !== 1 ? "s" : ""), "success");
      }

      function renderMetrics(blocks, scansInRange) {
        if (blocks.length === 0) {
          document.getElementById("rp-metrics").innerHTML =
            '<div class="col-span-4" style="grid-column:1/-1;color:var(--muted);font-size:var(--font-size-sm);">No data for the selected filters.</div>';
          return;
        }

        const plantsAvailable = blocks.every((block) => Number.isSafeInteger(block.plants));
        const totalPlants = blocks.reduce((s, b) => s + (b.plants || 0), 0);
        const avgBearing = blocks.reduce((s, b) => s + b.bearing, 0) / blocks.length;
        const avgNonbearing = blocks.reduce((s, b) => s + b.nonbearing, 0) / blocks.length;
        const avgNonViable = blocks.reduce((s, b) => s + b.nonViable, 0) / blocks.length;
        const totalArea = blocks.reduce((s, b) => s + b.area, 0);

        document.getElementById("rp-metrics").innerHTML =
          utils.buildMetricCard("Blocks in Report", blocks.length, blocks.length + " of " + BLOCKS_RAW.length + " total", "") +
          utils.buildMetricCard("Scans in Range", scansInRange.length, "Linked scan sessions", "green") +
          utils.buildMetricCard("Estimated Plant Count", plantsAvailable ? utils.formatNumber(totalPlants) : "Unavailable", "Estimated total pineapple plants", "") +
          utils.buildMetricCard("Avg Bearing Rate", utils.formatPercent(avgBearing), "of selected blocks", "green") +
          utils.buildMetricCard("Avg Non-Bearing", utils.formatPercent(avgNonbearing), "of selected blocks", "amber") +
          utils.buildMetricCard("Avg Non-Viable", utils.formatPercent(avgNonViable), "of selected blocks", "yellow") +
          utils.buildMetricCard("Total Area", totalArea.toFixed(1) + " ha", "selected area coverage", "") +
          utils.buildMetricCard("Unique Users", new Set(blocks.map((b) => b.operatorName)).size, "flying selected blocks", "");
      }

      function renderTable(blocks) {
        const content = document.getElementById("rp-content");

        if (blocks.length === 0) {
          content.innerHTML =
            '<div class="card"><div class="empty-state">' +
            '<div class="empty-state-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>' +
            '<div class="empty-state-title">No blocks match the selected filters</div>' +
            '<div class="empty-state-text">Try widening the date range or clearing a filter.</div>' +
            "</div></div>";
          return;
        }

        let html =
          '<div class="tcard">' +
          '<div class="thead-row"><div class="thead-title">Block Results</div>' +
          '<span style="font-size:var(--font-size-sm);color:var(--muted);">' +
          blocks.length + " result" + (blocks.length !== 1 ? "s" : "") + "</span></div>" +
          '<div class="twrap"><table class="rp-table">' +
          "<colgroup>" +
          '<col class="c-block"><col class="c-section"><col class="c-operator"><col class="c-daf"><col class="c-area"><col class="c-bearing"><col class="c-nonbearing"><col class="c-nonviable"><col class="c-status">' +
          "</colgroup>" +
          "<thead><tr>" +
          "<th>Block</th><th>Section</th><th>User</th><th>DAF</th><th>Area</th><th>Bearing</th><th>Non-Bearing</th><th>Non-Viable</th><th>Status</th>" +
          "</tr></thead><tbody>";

        blocks.forEach(function (block) {
          const statusClass = blockStatusClass(block);
          html += `
                    <tr>
                        <td><strong>${escapeHtml(block.blockName)}</strong></td>
                        <td>${escapeHtml(block.section)}</td>
                        <td style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">${escapeHtml(block.operatorName)}</td>
                        <td style="font-family:var(--font-mono);">${block.daf}d</td>
                        <td style="font-family:var(--font-mono);">${utils.formatArea(block.area)}</td>
                        <td>${utils.buildInlineBar(block.bearing, utils.barColor(block.bearing))}</td>
                        <td>${utils.buildInlineBar(block.nonbearing, "var(--amber-mid)")}</td>
                        <td>${utils.buildInlineBar(block.nonViable, "var(--yellow-mid)")}</td>
                        <td>${blockStatusBadge(statusClass)}</td>
                    </tr>`;
        });

        html += "</tbody></table></div></div>";
        content.innerHTML = html;
      }

      function clearFilters() {
        document.getElementById("rp-filter-block").value = "all";
        document.getElementById("rp-filter-operator").value = "all";
        document.getElementById("rp-filter-status").value = "all";
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);
        document.getElementById("rp-date-to").value = today.toISOString().split("T")[0];
        document.getElementById("rp-date-from").value = monthAgo.toISOString().split("T")[0];
        document.getElementById("report-results").classList.remove("visible");
      }

      // ── Status helpers ───────────────────────────────────────────

      function blockStatusClass(block) {
        if (!block.totalScans || block.plants <= 0) return "none";
        return utils.getStatusClass(block.bearing);
      }

      function blockStatusBadge(status) {
        if (status === "none") {
          return '<span class="badge" style="background-color:var(--surf2);color:var(--color-text-secondary);border-color:var(--border);"><span class="bdot" style="background-color:var(--color-text-tertiary);"></span>No Scan Data</span>';
        }
        return utils.statusBadge(status);
      }

      function statusLabel(status) {
        if (status === "none") return "No Scan Data";
        return utils.getStatusText(status);
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
    </script>

  </body>
</html>
