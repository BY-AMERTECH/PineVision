    <style>
      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf);
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        text-decoration: none;
        white-space: nowrap;
        line-height: 1.5;
      }
      .btn-back:hover {
        border-color: var(--green);
        color: var(--green);
        background-color: var(--green-bg);
      }

      .block-page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--space-lg);
        flex-wrap: wrap;
        margin-bottom: var(--space-xl);
      }
      .block-header-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-sm);
      }
      .block-title-row {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        flex-wrap: wrap;
      }
      .block-page-title {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        line-height: 1.25;
        margin: 0;
      }
      .block-page-subtitle {
        font-size: var(--font-size-sm);
        color: var(--muted);
        margin-top: var(--space-xs);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .readonly-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background-color: var(--surf2);
        color: var(--color-text-secondary);
        border: 1px solid var(--border);
      }

      .info-card {
        background-color: var(--surf);
        border: 1.5px solid var(--color-border-secondary);
        border-radius: var(--radius-lg);
        padding: var(--space-xl);
        height: 100%;
        box-shadow: var(--shadow-xs);
      }
      .info-card-title {
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: var(--space-md);
        padding-bottom: var(--space-sm);
        border-bottom: var(--border-width-thin) solid var(--border);
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-sm) 0;
        font-size: var(--font-size-sm);
        border-bottom: var(--border-width-thin) solid var(--border);
      }
      .stat-row:last-child { border-bottom: none; }
      .stat-label {
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .stat-label svg { color: var(--color-text-tertiary); flex-shrink: 0; }
      .stat-value {
        font-family: var(--font-mono);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }

      .trend-row {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        padding: 6px 0;
        border-bottom: var(--border-width-thin) solid var(--border);
      }
      .trend-row:last-child { border-bottom: none; }
      .trend-date {
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        color: var(--muted);
        min-width: 52px;
      }
      .trend-bar-wrap { flex: 1; }
      .trend-val {
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
        min-width: 44px;
        text-align: right;
      }
      .trend-compact-card .thead-row { border-bottom: none; }
      .trend-compact-card .thead-row { flex-wrap: wrap; gap: var(--space-md); }
      .trend-compact-card .thead-row > .d-flex { flex-wrap: wrap; min-width: 0; }
      .trend-compact-card .trend-actions { margin-left: auto; flex-shrink: 0; }
      .trend-view-hint { font-size: var(--font-size-xs); color: var(--muted); }

      .bar-wrap {
        position: relative;
        width: 100%;
        height: 8px;
        background-color: var(--surf2);
        border-radius: var(--radius-pill);
        overflow: hidden;
        margin-bottom: 6px;
      }
      .bar-fill {
        height: 100%;
        border-radius: var(--radius-pill);
        transition: width 0.3s ease;
      }

      .mcard {
        background-color: var(--surf);
        border: 1px solid var(--color-border-secondary);
        border-radius: var(--radius-lg);
        padding: var(--space-lg) var(--card-padding-x);
        box-shadow: var(--shadow-card);
        transition: all var(--transition-fast);
        height: 100%;

      .mc-green { background-color: var(--green-bg); border-color: rgba(76, 175, 120, 0.22); }
      .mc-green .mc-val { color: var(--green); }
      .mc-amber { background-color: var(--amber-bg); border-color: rgba(230, 168, 23, 0.22); }
      .mc-amber .mc-val { color: var(--amber); }
      .mc-red { background-color: var(--red-bg); border-color: rgba(217, 90, 90, 0.22); }
      .mc-red .mc-val { color: var(--red); }

      @media (max-width: 580px) {
        .block-page-header { flex-direction: column; }
      }

    <script>
      if (!auth.requireFarmManager()) {
        /* redirects */
      }
      let currentBlock = null;

      window.initPage = async function () {
        utils.setupModalClose("trend-modal");

        const blockId = new URLSearchParams(window.location.search).get("id");
        if (!blockId) {
          window.location.href = "blocks.html";
          return;
        }

        await loadBlock(blockId);
      };

      async function loadBlock(blockId) {
        try {
          console.log("📥 Loading block", blockId, "from Firestore...");

          const results = await Promise.all([
            firebase.firestore().collection("blocks").doc(blockId).get(),
            firebase.firestore().collection("users").limit(200).get(),
          ]);

          const blockDoc = results[0];
          const usersSnap = results[1];

          if (!blockDoc.exists) {
            renderNotFound();
            return;
          }

          const usersById = {};
          usersSnap.forEach(function (doc) {
            const d = doc.data();
            usersById[doc.id] = d.fullName || d.username || d.email || doc.id;
          });

          const d = blockDoc.data();
          currentBlock = {
            id: blockDoc.id,
            activeCycleId: d.activeCycleId || null,
            blockId: d.blockId || blockDoc.id,
            blockName: d.blockName || d.blockId || blockDoc.id,
            userId: d.userId || "",
            registeredBy: usersById[d.userId] || d.userId || "Unassigned",
            section: d.section || "—",
            area: typeof d.area === "number" ? d.area : parseFloat(d.area) || 0,
            stage: d.stage || "",
            daf: typeof d.daf === "number" ? d.daf : parseInt(d.daf, 10) || 0,
            planted: d.planted || "",
            forcingDate: d.forcingDate || "",
            bearing: d.bearingPercent || 0,
            nonbearing: d.nonBearingPercent || 0,
            nonViable: d.nonViable || 0,
            plants: d.totalPineapples || 0,
            totalScans: d.totalScans || 0,
            lastScanned: d.lastScanned || null,
            estimatedTotalPlantCount: null,
          };

          try {
            const latestCounts = await blockScanHistory.loadLatestPlantCounts(
              [blockDoc.id],
              null,
              { [blockDoc.id]: currentBlock.activeCycleId },
            );
            currentBlock.estimatedTotalPlantCount = latestCounts.get(blockDoc.id) || 0;
          } catch (scanError) {
            console.error("❌ Error loading latest completed plant counts:", scanError);
          }

          document.title = currentBlock.blockName + " — PineVision";
          renderPage(currentBlock);
        } catch (error) {
          console.error("❌ Error loading block:", error);
          renderNotFound();
        }
      }

      function renderNotFound() {
        document.getElementById("block-detail-root").innerHTML = `
          <div class="fb-empty" style="padding: var(--space-4xl) 0; text-align:center;">
            <p style="color: var(--muted); margin-bottom: var(--space-lg);">This Fruit Block could not be found.</p>
            <a href="blocks.html" class="btn btn-secondary"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg> Back to Fruit Blocks</a>
          </div>`;
      }

      // ── Render read-only page ──────────────────────────────────────

      function renderPage(block) {
        const statusClass = getStatusClass(block);
        const hasScanData = block.plants > 0;

        const bearingCount = hasScanData ? Math.round((block.bearing / 100) * block.plants) : 0;
        const nonbearingCount = hasScanData ? Math.round((block.nonbearing / 100) * block.plants) : 0;
        const nonViableCount = hasScanData ? Math.round((block.nonViable / 100) * block.plants) : 0;
        const bearingAndNonbearingTotal = bearingCount + nonbearingCount;
        const estimatedTotalPlants = block.estimatedTotalPlantCount || bearingAndNonbearingTotal;
        const bearingPercent = bearingAndNonbearingTotal > 0
          ? (bearingCount / bearingAndNonbearingTotal) * 100
          : 0;
        const nonbearingPercent = bearingAndNonbearingTotal > 0
          ? (nonbearingCount / bearingAndNonbearingTotal) * 100
          : 0;
        const nonViablePercent = estimatedTotalPlants > 0
          ? (nonViableCount / estimatedTotalPlants) * 100
          : 0;
        const plantSub = (n) => (hasScanData ? formatNumber(n) + " plants" : "—");

        document.getElementById("block-detail-root").innerHTML = `
          <div class="block-page-header">
            <div class="block-header-left">
              <a href="blocks.html" class="btn-back"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg> All Fruit Blocks</a>
              <div>
                <div class="block-title-row">
                  <h1 class="block-page-title">${escapeHtml(block.blockName)}</h1>
                  ${statusBadge(statusClass)}
                  <span class="readonly-chip">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M20 12c0 5-3.58 9-8 9s-8-4-8-9 3.58-9 8-9 8 4 8 9z"/>
                    </svg>
                    Read-Only View
                  </span>
                </div>
                <div class="block-page-subtitle">
                  Registered by ${escapeHtml(block.registeredBy)} &middot; ${escapeHtml(block.section)} &middot; ${formatArea(block.area)} &middot; ${escapeHtml(growthStageLabel(block))}
                </div>
                ${utils.recentScanBadge(block.lastScanned)}
              </div>
            </div>
          </div>

          <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">
            ${buildMetricCard("Estimated Total Plant Count", block.estimatedTotalPlantCount === null ? "Unavailable" : formatNumber(block.estimatedTotalPlantCount), "Estimated Count of all Pineapple plants", "")}
            ${buildMetricCard("Bearing", formatPercent(bearingPercent), plantSub(bearingCount), "green")}
            ${buildMetricCard("Non-Bearing", formatPercent(nonbearingPercent), plantSub(nonbearingCount), "amber")}
            ${buildMetricCard("Non-Viable", formatPercent(nonViablePercent), plantSub(nonViableCount), "red")}
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="info-card">
                <div class="info-card-title">General Details</div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                    Block ID
                  </span>
                  <span class="stat-value">${escapeHtml(block.blockName)}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Registered By
                  </span>
                  <span class="stat-value">${escapeHtml(block.registeredBy)}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    Section
                  </span>
                  <span class="stat-value">${escapeHtml(block.section)}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    Area
                  </span>
                  <span class="stat-value">${formatArea(block.area)}</span>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="info-card">
                <div class="info-card-title">Crop &amp; Growth Details</div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Planting Date
                  </span>
                  <span class="stat-value">${escapeHtml(formatDateValue(block.planted))}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                    Forcing Date
                  </span>
                  <span class="stat-value">${escapeHtml(formatDateValue(block.forcingDate))}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                    Growth Stage (DAF)
                  </span>
                  <span class="stat-value">${block.daf ? block.daf + " days" : "—"}</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Total Scans
                  </span>
                  <span class="stat-value">${formatNumber(block.totalScans)}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="tcard trend-compact-card mb-4">
            <div class="thead-row" style="padding: var(--space-md) var(--space-xl)">
              <div class="d-flex align-items-center gap-3">
                <span class="thead-title">Scan History</span>
                <span class="trend-view-hint">View Scan History</span>
              </div>
              <div class="d-flex align-items-center gap-2 trend-actions">
                <button type="button" class="btn btn-sm btn-secondary" onclick="downloadTrendDetails(this)" title="Download scan details" aria-label="Download scan details"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
                <button type="button" class="btn btn-sm btn-navigation" onclick="openTrendModal()"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg> View <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
              </div>
            </div>
          </div>

          <div class="tcard mb-4" id="condition-breakdown"></div>
        `;

        renderConditionBreakdown(block, hasScanData, bearingCount, nonbearingCount, nonViableCount);
      }

      function renderConditionBreakdown(block, hasScanData, bearingCount, nonbearingCount, nonViableCount) {
        const fmtPlant = (n) => (hasScanData ? formatNumber(n) : "—");
        const totalPlants = bearingCount + nonbearingCount;
        const bearingPercent = totalPlants > 0 ? (bearingCount / totalPlants) * 100 : 0;
        const nonbearingPercent = totalPlants > 0 ? (nonbearingCount / totalPlants) * 100 : 0;
        document.getElementById("condition-breakdown").innerHTML = `
        <div class="thead-row">
            <span class="thead-title">Fruit Condition Breakdown</span>
        </div>
        <div class="twrap">
            <table class="fruit-breakdown-table">
                <colgroup>
                    <col style="width:38%"><col style="width:14%"><col style="width:48%">
                </colgroup>
                <tbody>
                    <tr>
                        <td><div class="fruit-breakdown-condition">
                            <span class="badge good"><span class="bdot"></span>Bearing</span>
                            <span class="fruit-breakdown-note">Fruit detected</span>
                        </div></td>
                        <td class="fruit-breakdown-count">${fmtPlant(bearingCount)}</td>
                        <td><div class="fruit-breakdown-distribution">
                            <div class="fruit-breakdown-track"><span class="fruit-breakdown-fill" style="width:${bearingPercent}%;background:var(--green);"></span></div>
                            <span class="fruit-breakdown-percent">${totalPlants > 0 ? formatPercent(bearingPercent) : "—"}</span>
                        </div></td>
                    </tr>
                    <tr>
                        <td><div class="fruit-breakdown-condition">
                            <span class="badge warn"><span class="bdot"></span>Non-Bearing</span>
                            <span class="fruit-breakdown-note">No fruit yet</span>
                        </div></td>
                        <td class="fruit-breakdown-count">${fmtPlant(nonbearingCount)}</td>
                        <td><div class="fruit-breakdown-distribution">
                            <div class="fruit-breakdown-track"><span class="fruit-breakdown-fill" style="width:${nonbearingPercent}%;background:var(--amber);"></span></div>
                            <span class="fruit-breakdown-percent">${totalPlants > 0 ? formatPercent(nonbearingPercent) : "—"}</span>
                        </div></td>
                    </tr>
                    <tr class="fruit-breakdown-total">
                        <td class="fruit-breakdown-total-label">Total Plants</td>
                        <td class="fruit-breakdown-count">${fmtPlant(totalPlants)}</td>
                        <td><div class="fruit-breakdown-distribution">
                            <div class="fruit-breakdown-track">
                                <span class="fruit-breakdown-fill" style="width:${bearingPercent}%;background:var(--green);"></span>
                                <span class="fruit-breakdown-fill" style="width:${nonbearingPercent}%;background:var(--amber);"></span>
                            </div>
                            <span class="fruit-breakdown-percent">${totalPlants > 0 ? "100%" : "—"}</span>
                        </div></td>
                    </tr>
                    <tr class="fruit-breakdown-other">
                        <td colspan="3" class="fruit-breakdown-other-label-cell"><span class="fruit-breakdown-other-label">Other Detections</span></td>
                    </tr>
                    <tr class="fruit-breakdown-other">
                        <td><div class="fruit-breakdown-other-content">
                            <span class="badge crit"><span class="bdot"></span>Non-Viable</span>
                            <span class="fruit-breakdown-not-counted">Not counted</span>
                        </div></td>
                        <td class="fruit-breakdown-count">${fmtPlant(nonViableCount)}</td>
                        <td><span class="fruit-breakdown-excluded">Excluded from total and distribution</span></td>
                    </tr>
                </tbody>
            </table>
        </div>`;
      }

      // ── Scan History modal ──────────────────────────────────────────

      async function openTrendModal() {
        if (!currentBlock) return;
        utils.showModal("trend-modal");
        document.getElementById("trend-modal-content").innerHTML =
          '<div style="padding:var(--space-xl);text-align:center;color:var(--muted);">Loading scan history…</div>';
        await renderTrendModal();
      }

      function downloadTrendDetails(button) {
        if (!currentBlock) return;
        return blockScanHistory.download(currentBlock, currentBlock.userId, button);
      }

      function closeTrendModal() {
        utils.hideModal("trend-modal");
      }

      async function renderTrendModal() {
        try {
          const history = await blockScanHistory.load(currentBlock.id, currentBlock.userId, true);

          blockScanHistory.render(history, document.getElementById("trend-modal-content"), currentBlock);
        } catch (error) {
          console.error("❌ Error loading scan history:", error);
          document.getElementById("trend-modal-content").innerHTML =
            '<div style="padding:var(--space-xl);text-align:center;color:var(--color-text-secondary);">Couldn\'t load scan history. Please try again.</div>';
        }
      }

      // ── Helpers ───────────────────────────────────────────────────

      function getStatusClass(block) {
        if (!block.totalScans || block.plants <= 0) return "none";
        if (block.bearing >= 80) return "good";
        if (block.bearing >= 60) return "warn";
        return "crit";
      }

      function statusBadge(status) {
        if (status === "none") {
          return '<span class="badge" style="background-color:var(--surf2);color:var(--color-text-secondary);border-color:var(--border);"><span class="bdot" style="background-color:var(--color-text-tertiary);"></span>No Scan Data</span>';
        }
        const labels = { good: "Healthy", warn: "Watch", crit: "Critical" };
        return `<span class="badge ${status}"><span class="bdot"></span>${labels[status]}</span>`;
      }

      function growthStageLabel(block) {
        if (typeof block.daf === "number" && block.daf > 0) return block.daf + " DAF";
        if (block.stage) return block.stage;
        return "Stage unknown";
      }

      function buildMetricCard(label, value, sub, color) {
        const colorClass = color ? "mc-" + color : "";
        return `
        <div class="col">
            <div class="mcard ${colorClass}">
                <div class="mc-label">${label}</div>
                <div class="mc-val">${value}</div>
                <div class="mc-sub">${sub}</div>
            </div>
        </div>`;
      }

      function formatNumber(num) { return (num || 0).toLocaleString("en-US"); }
      function formatPercent(num) { return (num || 0).toFixed(1) + "%"; }
      function formatArea(area) { return (area || 0) + " ha"; }

      function formatDateValue(value) {
        if (!value) return "—";
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (m) {
          const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
          if (!isNaN(d.getTime())) {
            return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "2-digit" });
          }
        }
        return value;
      }

      function formatScheduledDateTime(date) {
        if (!(date instanceof Date) || isNaN(date.getTime())) return "Unknown date";
        const datePart = date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "2-digit" });
        const timePart = date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        return datePart + " · " + timePart;
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
    </script>
  </body>
</html>
