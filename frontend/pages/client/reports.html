<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("pinevision_settings") || "{}",
          );
          if (s.theme === "dark")
            document.documentElement.classList.add("dark-mode");
        } catch (e) {}
      })();
    </script>
    <title>Reports - PineVision</title>

    <!-- CSS: Bootstrap first, then custom overrides -->
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />

    <style>
      /* ── Filter Panel ──────────────────────────────────── */
      .filter-panel {
        background-color: var(--surf);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }

      .filter-panel-title {
        font-size: var(--font-size-md);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: var(--space-lg);
      }

      .filter-field {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .filter-field-label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }

      .filter-select,
      .filter-date {
        padding: var(--space-md);
        font-size: var(--font-size-base);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        transition: border-color var(--transition-fast);
      }

      .filter-select:focus,
      .filter-date:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-bg);
      }

      .filter-actions {
        display: flex;
        gap: var(--space-md);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--space-lg);
      }

      /* ── Report Results ────────────────────────────────── */
      .report-results {
        display: none;
      }

      .report-results.visible {
        display: block;
      }

      .report-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-lg);
        flex-wrap: wrap;
        gap: var(--space-md);
      }

      .report-title-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .report-title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
      }

      .report-subtitle {
        font-size: var(--font-size-sm);
        color: var(--muted);
      }

      .export-actions {
        display: flex;
        gap: var(--space-sm);
      }

      .btn-export {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-lg);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf2);
        color: var(--color-text-secondary);
        cursor: not-allowed;
        font-family: var(--font-sans);
        opacity: 0.7;
        position: relative;
      }

      /* Enabled export buttons (e.g. Export CSV, once wired up) get the
         normal clickable look instead of the disabled-stub styling above. */
      .btn-export:not(:disabled) {
        cursor: pointer;
        opacity: 1;
      }

      .btn-export:not(:disabled):hover {
        border-color: var(--color-text-tertiary, var(--border));
      }

      .btn-export-label {
        position: absolute;
        top: -8px;
        right: -4px;
        font-size: 9px;
        font-weight: var(--font-weight-semibold);
        background-color: var(--amber-bg);
        color: var(--amber);
        padding: 1px 5px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--amber);
        white-space: nowrap;
      }
    </style>
  </head>

    <script>
      // ══════════════════════════════════════════════════════════════
      // Reports — live Firestore sync (this client's own farm only)
      //
      // Blocks are fetched from the real `blocks` collection, scoped to
      // the signed-in user (.where('userId','==',currentUser.uid)),
      // exactly like blocks.html. Scans are fetched the same way and
      // joined client-side to count how many scan sessions fall inside
      // the selected date range for the filtered blocks. Report
      // generation itself stays client-side/instant against this cached
      // data, matching the existing filter-panel UX.
      // ══════════════════════════════════════════════════════════════

      let BLOCKS_RAW = [];  // [{id, blockName, section, stage, daf, area, bearing, nonbearing, nonViable, plants}]
      let SCANS_RAW = [];   // [{id, blockId, startTime}]
      let dataReady = false;
      let CURRENT_REPORT_BLOCKS = [];  // last filtered set rendered by generateReport(), used by exportReportCSV()

      window.initPage = function () {
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);

        document.getElementById("date-to").value = today
          .toISOString()
          .split("T")[0];
        document.getElementById("date-from").value = monthAgo
          .toISOString()
          .split("T")[0];

        loadReportData();
      };

      function loadReportData() {
        const currentUser = auth.getCurrentUser();
        if (!currentUser) {
          console.warn("⚠️ No user logged in");
          window.location.href = "/index.html";
          return;
        }

        const placeholder = document.getElementById("rp-status-placeholder");
        placeholder.style.display = "block";
        placeholder.textContent = "Loading your farm data…";

        Promise.all([
          firebase.firestore().collection("blocks").where("userId", "==", currentUser.uid).get(),
          firebase.firestore().collection("scans").where("userId", "==", currentUser.uid).get(),
        ])
          .then(function (results) {
            const blocksSnap = results[0];
            const scansSnap = results[1];

            BLOCKS_RAW = [];
            blocksSnap.forEach(function (doc) {
              const d = doc.data();
              BLOCKS_RAW.push({
                id: doc.id,
                blockName: d.blockName || d.blockId || doc.id,
                section: d.section || "—",
                stage: d.stage || "—",
                daf: typeof d.daf === "number" ? d.daf : parseInt(d.daf, 10) || 0,
                area: typeof d.area === "number" ? d.area : parseFloat(d.area) || 0,
                bearing: d.bearingPercent || 0,
                nonbearing: d.nonBearingPercent || 0,
                nonViable: d.nonViable || 0,
                plants: d.declaredPopulation || d.totalPineapples || 0,
                totalScans: d.totalScans || 0,
              });
            });

            SCANS_RAW = [];
            scansSnap.forEach(function (doc) {
              const d = doc.data();
              SCANS_RAW.push({
                id: doc.id,
                blockId: d.blockId || "",
                startTime: d.startTime && typeof d.startTime.toDate === "function" ? d.startTime.toDate() : null,
              });
            });

            dataReady = true;
            placeholder.style.display = "none";
            populateBlockFilter();

            // If a report is already open (e.g. re-load after an edit
            // elsewhere), keep it live by re-running the same filters.
            const resultsEl = document.getElementById("report-results");
            if (resultsEl.classList.contains("visible")) generateReport();
          })
          .catch(function (error) {
            console.error("❌ Error loading report data:", error);
            placeholder.style.display = "block";
            placeholder.innerHTML =
              'Couldn\'t load your farm data. ' +
              '<button class="btn btn-sm btn-secondary" onclick="loadReportData()">Retry</button>';
          });
      }

      function populateBlockFilter() {
        const select = document.getElementById("filter-block");
        const current = select.value;
        select.innerHTML =
          '<option value="all">All Blocks</option>' +
          BLOCKS_RAW.slice()
            .sort((a, b) => a.blockName.localeCompare(b.blockName))
            .map((b) => `<option value="${escapeHtml(b.id)}">${escapeHtml(b.blockName)} — ${escapeHtml(b.section)}</option>`)
            .join("");
        select.value = current || "all";
      }

      function generateReport() {
        if (!dataReady) return;

        const blockFilter = document.getElementById("filter-block").value;
        const statusFilter = document.getElementById("filter-status").value;
        const dateFrom = document.getElementById("date-from").value;
        const dateTo = document.getElementById("date-to").value;

        let blocks = BLOCKS_RAW;

        if (blockFilter !== "all")
          blocks = blocks.filter((b) => b.id === blockFilter);
        if (statusFilter !== "all")
          blocks = blocks.filter((b) => blockStatusClass(b) === statusFilter);

        const parts = [];
        if (dateFrom) parts.push("From " + dateFrom);
        if (dateTo) parts.push("To " + dateTo);
        if (blockFilter !== "all") {
          const b = BLOCKS_RAW.find((x) => x.id === blockFilter);
          parts.push("Block " + (b ? b.blockName : blockFilter));
        }
        if (statusFilter !== "all")
          parts.push(statusLabel(statusFilter) + " only");

        document.getElementById("report-title-text").textContent =
          "Farm Performance Report";
        document.getElementById("report-subtitle-text").textContent =
          parts.length ? parts.join(" · ") : "All blocks · All statuses";

        renderMetrics(blocks);
        renderTable(blocks);
        CURRENT_REPORT_BLOCKS = blocks;

        const results = document.getElementById("report-results");
        results.classList.add("visible");
        results.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      /* ── Export CSV ────────────────────────────────────────────────
       * Reuses the same Blob/createObjectURL pattern as
       * admin/activity.html's exportCSV() — exports the report table
       * exactly as currently filtered/generated. */
      function exportReportCSV() {
        if (!CURRENT_REPORT_BLOCKS.length) {
          utils.showToast("Generate a report first.", "info");
          return;
        }
        const rows = [
          [
            "Block",
            "Section",
            "Stage",
            "Days After Flowering",
            "Area (ha)",
            "Bearing %",
            "Non-Viable %",
            "Status",
          ],
        ];
        CURRENT_REPORT_BLOCKS.forEach((block) => {
          rows.push([
            '"' + (block.blockName || "").replace(/"/g, '""') + '"',
            '"' + (block.section || "").replace(/"/g, '""') + '"',
            '"' + (block.stage || "").replace(/"/g, '""') + '"',
            block.daf,
            block.area,
            block.bearing.toFixed(1),
            block.nonViable.toFixed(1),
            statusLabel(blockStatusClass(block)),
          ]);
        });
        const csv = rows.map((r) => r.join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pinevision-report-" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();
        URL.revokeObjectURL(url);
        utils.showToast("Exported " + CURRENT_REPORT_BLOCKS.length + " block" + (CURRENT_REPORT_BLOCKS.length !== 1 ? "s" : ""), "success");
      }

      function renderMetrics(blocks) {
        if (blocks.length === 0) {
          document.getElementById("report-metrics").innerHTML =
            '<div class="col-12" style="color:var(--muted);font-size:var(--font-size-sm);">No data for selected filters.</div>';
          return;
        }

        const totalPlants = blocks.reduce((s, b) => s + b.plants, 0);
        const avgBearing =
          blocks.reduce((s, b) => s + b.bearing, 0) / blocks.length;
        const avgNonbearing =
          blocks.reduce((s, b) => s + b.nonbearing, 0) / blocks.length;
        const avgNonViable =
          blocks.reduce((s, b) => s + b.nonViable, 0) / blocks.length;
        const totalArea = blocks.reduce((s, b) => s + b.area, 0);

        document.getElementById("report-metrics").innerHTML = `
                ${utils.buildMetricCard("Blocks in Report", blocks.length, blocks.length + " of " + BLOCKS_RAW.length + " total", "")}
                ${utils.buildMetricCard("Total Plants", utils.formatNumber(totalPlants), "across selected blocks", "")}
                ${utils.buildMetricCard("Avg Bearing Rate", utils.formatPercent(avgBearing), "of selected blocks", "green")}
                ${utils.buildMetricCard("Avg Non-Bearing", utils.formatPercent(avgNonbearing), "of selected blocks", "amber")}
                ${utils.buildMetricCard("Avg Non-Viable", utils.formatPercent(avgNonViable), "fruit yellowing", "yellow")}
                ${utils.buildMetricCard("Total Area", totalArea.toFixed(1) + " ha", "selected area coverage", "")}
            `;
      }

      function renderTable(blocks) {
        document.getElementById("result-count").textContent =
          blocks.length + " result" + (blocks.length !== 1 ? "s" : "");

        if (blocks.length === 0) {
          document.getElementById("report-tbody").innerHTML =
            '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:var(--space-2xl);">No blocks match the selected filters.</td></tr>';
          return;
        }

        document.getElementById("report-tbody").innerHTML = blocks
          .map((block) => {
            const statusClass = blockStatusClass(block);
            return `
                    <tr>
                        <td><strong>${escapeHtml(block.blockName)}</strong></td>
                        <td>${escapeHtml(block.section)}</td>
                        <td style="font-size:var(--font-size-sm);color:var(--muted);">${escapeHtml(block.stage)}</td>
                        <td style="font-family:var(--font-mono);">${block.daf}d</td>
                        <td style="font-family:var(--font-mono);">${utils.formatArea(block.area)}</td>
                        <td>${utils.buildInlineBar(block.bearing, utils.barColor(block.bearing))}</td>
                        <td>${utils.buildInlineBar(block.nonViable, "var(--yellow-mid)")}</td>
                        <td>${blockStatusBadge(statusClass)}</td>
                    </tr>`;
          })
          .join("");
      }

      function blockStatusClass(block) {
        if (!block.totalScans || block.plants <= 0) return "none";
        return utils.getStatusClass(block.bearing);
      }

      function blockStatusBadge(status) {
        if (status === "none") {
          return '<span class="badge" style="background-color:var(--surf2);color:var(--color-text-secondary);border-color:var(--border);"><span class="bdot" style="background-color:var(--color-text-tertiary);"></span>No Scan Data</span>';
        }
        return utils.statusBadge(status);
      }

      function statusLabel(status) {
        if (status === "none") return "No Scan Data";
        return utils.getStatusText(status);
      }

      function escapeHtml(str) {
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function clearFilters() {
        document.getElementById("filter-block").value = "all";
        document.getElementById("filter-status").value = "all";
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);
        document.getElementById("date-to").value = today
          .toISOString()
          .split("T")[0];
        document.getElementById("date-from").value = monthAgo
          .toISOString()
          .split("T")[0];

        document.getElementById("report-results").classList.remove("visible");
      }

    </script>
  </body>
</html>
