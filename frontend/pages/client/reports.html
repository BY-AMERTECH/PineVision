<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("pinevision_settings") || "{}",
          );
          if (s.theme === "dark")
            document.documentElement.classList.add("dark-mode");
        } catch (e) {}
      })();
    </script>
    <title>Reports - PineVision</title>

    <!-- CSS: Bootstrap first, then custom overrides -->
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />

    <style>
      /* ── Filter Panel ──────────────────────────────────── */
      .filter-panel {
        background-color: var(--surf);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-xl);
        margin-bottom: var(--space-2xl);
      }

      .filter-panel-title {
        font-size: var(--font-size-md);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: var(--space-lg);
      }

      .filter-field {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .filter-field-label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }

      .filter-select,
      .filter-date {
        padding: var(--space-md);
        font-size: var(--font-size-base);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        transition: border-color var(--transition-fast);
      }

      .filter-select:focus,
      .filter-date:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-bg);
      }

      .filter-actions {
        display: flex;
        gap: var(--space-md);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--space-lg);
      }

      /* ── Report Results ────────────────────────────────── */
      .report-results {
        display: none;
      }

      .report-results.visible {
        display: block;
      }

      .report-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-lg);
        flex-wrap: wrap;
        gap: var(--space-md);
      }

      .report-title-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .report-title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
      }

      .report-subtitle {
        font-size: var(--font-size-sm);
        color: var(--muted);
      }

      .export-actions {
        display: flex;
        gap: var(--space-sm);
      }

      .btn-export {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-lg);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-md);
        background-color: var(--surf2);
        color: var(--color-text-secondary);
        cursor: not-allowed;
        font-family: var(--font-sans);
        opacity: 0.7;
        position: relative;
      }

      .btn-export-label {
        position: absolute;
        top: -8px;
        right: -4px;
        font-size: 9px;
        font-weight: var(--font-weight-semibold);
        background-color: var(--amber-bg);
        color: var(--amber);
        padding: 1px 5px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--amber);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="d-flex min-vh-100">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-logo">
            <img
              src="/frontend/assets/images/pinevision-logo.svg"
              alt="PineVision"
              class="sidebar-logo-img"
            />
          </div>
          <div class="sidebar-brand-text">
            <div class="sidebar-brand-name">PineVision</div>
            <div class="sidebar-brand-tagline">Farm Monitoring</div>
          </div>
        </div>

        <button
          class="sidebar-collapse-btn"
          onclick="app.toggleSidebar()"
          aria-label="Toggle sidebar"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15,18 9,12 15,6" />
          </svg>
          <span class="nav-link-text">Collapse sidebar</span>
        </button>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-section-title">Main Menu</div>
            <ul class="nav-links">
              <li>
                <a href="dashboard.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/nav-dashboard.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Dashboard</span>
                </a>
              </li>
              <li>
                <a href="blocks.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/nav-leaf.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Fruit Blocks</span>
                </a>
              </li>
              <li>
                <a href="scans.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/nav-clipboard.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Scan Log</span>
                </a>
              </li>
              <li>
                <a href="alerts.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/nav-bell.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Alerts</span>
                </a>
              </li>
              <li>
                <a href="settings.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/nav-cog.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Settings</span>
                </a>
              </li>
            </ul>
          </div>
          <div class="nav-section">
            <div class="nav-section-title">Field Operations</div>
            <ul class="nav-links">
              <li>
                <a href="flight.html" class="nav-link">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/flight.svg"
                      alt="Fl ight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Flight Missions</span>
                </a>
              </li>
              <li>
                <a href="reports.html" class="nav-link active">
                  <span class="nav-link-icon">
                    <img
                      src="/frontend/assets/icons/report.svg"
                      alt="Flight Icon"
                      width="20"
                    />
                  </span>
                  <span class="nav-link-text">Reports</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>


      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Topbar: page context (left) + signed-in account controls (right) -->
        <header class="topbar">
          <div class="topbar-page">
            <span class="topbar-page-icon" aria-hidden="true"></span>
            <div class="topbar-page-text">
              <h1 class="topbar-page-title"></h1>
              <p class="topbar-page-subtitle"></p>
            </div>
          </div>
          <div class="topbar-account">
            <button
              type="button"
              class="topbar-account-trigger"
              id="topbar-account-trigger"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="topbar-account-menu"
              aria-label="Open account menu"
            >
              <span class="topbar-account-avatar" aria-hidden="true"></span>
              <span class="topbar-account-info">
                <span class="topbar-account-name"></span>
                <span class="topbar-account-role"></span>
              </span>
              <svg
                class="topbar-account-caret"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
            <div
              class="topbar-account-menu"
              id="topbar-account-menu"
              role="menu"
              aria-label="Account"
              hidden
            >
              <div class="topbar-account-menu-header">
                <div class="topbar-account-menu-name"></div>
                <div class="topbar-account-menu-email"></div>
              </div>
              <button
                type="button"
                class="topbar-account-logout"
                role="menuitem"
                onclick="app.handleTopbarLogout()"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Logout
              </button>
            </div>
          </div>
        </header>

        <div class="container-fluid py-4 px-4 page-container">
          <!-- Page Header -->
          <div class="mb-4">
          </div>

          <!-- Filter Panel -->
          <div class="filter-panel shadow-sm rounded-4">
            <div class="filter-panel-title">Report Filters</div>

            <div class="row g-3">
              <!-- Date Range -->
              <div class="col-sm-6 col-lg-3">
                <div class="filter-field">
                  <label class="filter-field-label" for="date-from"
                    >Date From</label
                  >
                  <input type="date" id="date-from" class="filter-date" />
                </div>
              </div>
              <div class="col-sm-6 col-lg-3">
                <div class="filter-field">
                  <label class="filter-field-label" for="date-to"
                    >Date To</label
                  >
                  <input type="date" id="date-to" class="filter-date" />
                </div>
              </div>

              <!-- Block -->
              <div class="col-sm-6 col-lg-3">
                <div class="filter-field">
                  <label class="filter-field-label" for="filter-block"
                    >Block</label
                  >
                  <select id="filter-block" class="filter-select">
                    <option value="all">All Blocks</option>
                    <option value="1">Block 1 — North A</option>
                    <option value="2">Block 2 — North B</option>
                    <option value="3">Block 3 — South A</option>
                    <option value="4">Block 4 — South B</option>
                    <option value="5">Block 5 — East A</option>
                    <option value="6">Block 6 — East B</option>
                    <option value="7">Block 7 — West A</option>
                    <option value="8">Block 8 — West B</option>
                  </select>
                </div>
              </div>

              <!-- Status -->
              <div class="col-sm-6 col-lg-3">
                <div class="filter-field">
                  <label class="filter-field-label" for="filter-status"
                    >Status</label
                  >
                  <select id="filter-status" class="filter-select">
                    <option value="all">All Statuses</option>
                    <option value="good">Healthy</option>
                    <option value="warn">Watch</option>
                    <option value="crit">Critical</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="filter-actions">
              <button class="btn btn-primary" onclick="generateReport()">
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
                <span>Generate Report</span>
              </button>
              <button class="btn btn-secondary" onclick="clearFilters()">
                <span>&#8635;</span>
                <span>Clear Filters</span>
              </button>
            </div>
          </div>

          <!-- Report Results (shown after Generate is clicked) -->
          <div class="report-results" id="report-results">
            <!-- Report Title + Export Buttons -->
            <div class="report-header-bar">
              <div class="report-title-group">
                <div class="report-title" id="report-title-text">
                  Farm Performance Report
                </div>
                <div class="report-subtitle" id="report-subtitle-text"></div>
              </div>
              <div class="export-actions">
                <button class="btn-export" title="PDF export coming soon">
                  <span>📄</span>
                  <span>Export PDF</span>
                  <span class="btn-export-label">Soon</span>
                </button>
                <button class="btn-export" title="CSV export coming soon">
                  <span>📊</span>
                  <span>Export CSV</span>
                  <span class="btn-export-label">Soon</span>
                </button>
              </div>
            </div>

            <!-- Summary Metrics: 6 cards, 2-col on sm, 3-col on md -->
            <div
              class="row row-cols-2 row-cols-md-3 g-3 mb-4"
              id="report-metrics"
            >
              <!-- Populated by JS -->
            </div>

            <!-- Results Table -->
            <div class="tcard">
              <div class="thead-row">
                <div class="thead-title">Block Results</div>
                <span
                  id="result-count"
                  style="font-size: var(--font-size-sm); color: var(--muted)"
                ></span>
              </div>
              <div class="twrap">
                <table>
                  <colgroup>
                    <col style="width: 90px" />
                    <col style="width: 100px" />
                    <col style="width: 110px" />
                    <col style="width: 80px" />
                    <col style="width: 80px" />
                    <col />
                    <col />
                    <col style="width: 100px" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>Block</th>
                      <th>Section</th>
                      <th>Stage</th>
                      <th>DAF</th>
                      <th>Area</th>
                      <th>Bearing</th>
                      <th>Non-Viable</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="report-tbody">
                    <!-- Populated by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Bootstrap JS -->
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Application JavaScript -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/data.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/app.js"></script>

    <script>
      window.initPage = function () {
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);

        document.getElementById("date-to").value = today
          .toISOString()
          .split("T")[0];
        document.getElementById("date-from").value = monthAgo
          .toISOString()
          .split("T")[0];

          
      };

      function generateReport() {
        const blockFilter = document.getElementById("filter-block").value;
        const statusFilter = document.getElementById("filter-status").value;
        const dateFrom = document.getElementById("date-from").value;
        const dateTo = document.getElementById("date-to").value;

        let blocks = data.getBlocks();

        if (blockFilter !== "all")
          blocks = blocks.filter((b) => String(b.id) === blockFilter);
        if (statusFilter !== "all")
          blocks = blocks.filter((b) => b.status === statusFilter);

        const parts = [];
        if (dateFrom) parts.push("From " + dateFrom);
        if (dateTo) parts.push("To " + dateTo);
        if (blockFilter !== "all") parts.push("Block " + blockFilter);
        if (statusFilter !== "all")
          parts.push(utils.getStatusText(statusFilter) + " only");

        document.getElementById("report-title-text").textContent =
          "Farm Performance Report";
        document.getElementById("report-subtitle-text").textContent =
          parts.length ? parts.join(" · ") : "All blocks · All statuses";

        renderMetrics(blocks);
        renderTable(blocks);

        const results = document.getElementById("report-results");
        results.classList.add("visible");
        results.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderMetrics(blocks) {
        if (blocks.length === 0) {
          document.getElementById("report-metrics").innerHTML =
            '<div class="col-12" style="color:var(--muted);font-size:var(--font-size-sm);">No data for selected filters.</div>';
          return;
        }

        const totalPlants = blocks.reduce((s, b) => s + b.plants, 0);
        const avgBearing =
          blocks.reduce((s, b) => s + b.bearing, 0) / blocks.length;
        const avgNonbearing =
          blocks.reduce((s, b) => s + b.nonbearing, 0) / blocks.length;
        const avgDiscolored =
          blocks.reduce((s, b) => s + b.discolored, 0) / blocks.length;
        const totalArea = blocks.reduce((s, b) => s + b.area, 0);

        document.getElementById("report-metrics").innerHTML = `
                ${utils.buildMetricCard("Blocks in Report", blocks.length, blocks.length + " of " + data.getBlocks().length + " total", "")}
                ${utils.buildMetricCard("Total Plants", utils.formatNumber(totalPlants), "across selected blocks", "")}
                ${utils.buildMetricCard("Avg Bearing Rate", utils.formatPercent(avgBearing), "of selected blocks", "green")}
                ${utils.buildMetricCard("Avg Non-Bearing", utils.formatPercent(avgNonbearing), "of selected blocks", "amber")}
                ${utils.buildMetricCard("Avg Non-Viable", utils.formatPercent(avgDiscolored), "fruit yellowing", "yellow")}
                ${utils.buildMetricCard("Total Area", totalArea.toFixed(1) + " ha", "selected area coverage", "")}
            `;
      }

      function renderTable(blocks) {
        document.getElementById("result-count").textContent =
          blocks.length + " result" + (blocks.length !== 1 ? "s" : "");

        if (blocks.length === 0) {
          document.getElementById("report-tbody").innerHTML =
            '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:var(--space-2xl);">No blocks match the selected filters.</td></tr>';
          return;
        }

        document.getElementById("report-tbody").innerHTML = blocks
          .map((block) => {
            const statusClass = utils.getStatusClass(block.bearing);
            return `
                    <tr>
                        <td><strong>Block ${block.id}</strong></td>
                        <td>${block.section}</td>
                        <td style="font-size:var(--font-size-sm);color:var(--muted);">${block.stage}</td>
                        <td style="font-family:var(--font-mono);">${block.daf}d</td>
                        <td style="font-family:var(--font-mono);">${utils.formatArea(block.area)}</td>
                        <td>${utils.buildInlineBar(block.bearing, utils.barColor(block.bearing))}</td>
                        <td>${utils.buildInlineBar(block.discolored, "var(--yellow-mid)")}</td>
                        <td>${utils.statusBadge(statusClass)}</td>
                    </tr>`;
          })
          .join("");
      }

      function clearFilters() {
        document.getElementById("filter-block").value = "all";
        document.getElementById("filter-status").value = "all";
        const today = new Date();
        const monthAgo = new Date(today);
        monthAgo.setDate(today.getDate() - 30);
        document.getElementById("date-to").value = today
          .toISOString()
          .split("T")[0];
        document.getElementById("date-from").value = monthAgo
          .toISOString()
          .split("T")[0];

        document.getElementById("report-results").classList.remove("visible");
      }

    </script>
  </body>
</html>
