    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("pinevision_settings") || "{}",
          );
          if (s.theme === "dark")
            document.documentElement.classList.add("dark-mode");

    <style>
      .fb-search {
        position: relative;
        flex: 1;
        min-width: 220px;
        max-width: 360px;
      }

      .fb-search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
        display: flex;
      }

      .fb-search input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        font-size: var(--font-size-sm);
        border: 1px solid var(--color-border-primary);
        border-radius: var(--radius-md);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        font-family: var(--font-sans);
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }

      .fb-search input:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-bg);
      }

      .fb-search input::placeholder { color: var(--color-text-tertiary); }


      @media (max-width: 640px) {
        .filter-bar .fb-search { min-width: 0; max-width: none; flex-basis: 100%; }
      }

      /* ── Filter Bar ─────────────────────────────────────── */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-lg);
        align-items: center;
        justify-content: space-between;
        padding: var(--space-md) var(--space-lg);
        background-color: var(--surf);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-lg);
        margin-bottom: var(--space-lg);
      }

      .filter-bar-actions {
        display: flex;
        align-items: center;
        margin-left: auto;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        flex-wrap: wrap;
      }

      .filter-label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--muted);
        white-space: nowrap;
      }

      .filter-btn {
        padding: 4px var(--space-md);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        border: var(--border-width-base) solid var(--border);
        border-radius: var(--radius-pill);
        background-color: var(--surf2);
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-family: var(--font-sans);
        line-height: 1.5;
      }

      .filter-btn:hover {
        border-color: var(--green);
        color: var(--green);
      }

      .filter-btn.active {
        background-color: var(--green-bg);
        border-color: var(--green);
        color: var(--green);
      }

      /* ── Block Card Redesign ────────────────────────────── */
      .bcard-stage {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin: var(--space-xs) 0;
        line-height: 1.25;
      }

      .bcard-number {
        font-size: var(--font-size-xs);
        color: var(--muted);
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      .bcard-meta {
        font-size: var(--font-size-sm);
        color: var(--muted);
      }

      /* ── Block Card: bar + foot (current JS template) ──── */
      .bcard {
        display: flex;
        flex-direction: column;
      }

      .bcard-bar-section {
        margin-bottom: var(--space-md);
      }

      .bcard-bar-label {
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-medium);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: var(--space-xs);
      }

      .bcard-foot {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs) var(--space-md);
        padding-top: var(--space-md);
        border-top: var(--border-width-thin) solid var(--border);
        margin-top: auto;
      }

      .bcard-foot-stat {
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        color: var(--muted);
      }

      /* ── Empty / No-match state ─────────────────────────── */
      .empty-filter-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-4xl) var(--space-xl);
        color: var(--muted);
        min-height: 40vh;
      }

      .empty-filter-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        margin-bottom: var(--space-md);
        opacity: 0.4;
        color: var(--muted);
      }

      .empty-filter-icon {
        margin-bottom: var(--space-lg);
        opacity: 0.35;
      }

      .empty-filter-icon svg {
        width: 40px;
        height: 40px;
        display: inline-block;
      }

      .empty-filter-text {
        font-size: var(--font-size-base);
      }

      @media (max-width: 580px) {
        .modal .form-row {
          grid-template-columns: 1fr;
        }
        .filter-bar {
          gap: var(--space-md);
        }
        .block-detail-header {
          gap: var(--space-md);
        }
      }
    </style>

    <script>
      if (!auth.requireAuth()) {
        /* redirects */
      }

      // ── Feature toggle ──────────────────────────────────────────────
      // Set to true to re-enable declared population in calculations.
      const INCLUDE_DECLARED_POPULATION = false;

      const activeFilters = { status: "all" };
      let ALL_BLOCKS = [];

      window.initPage = async function () {
        await loadBlocksFromFirebase();
        utils.setupModalClose("add-block-modal");
      };

      // ── Load Blocks from Firebase ────────────────────────────────────

      async function loadBlocksFromFirebase() {
        try {
          console.log("📥 Loading blocks from Firestore...");

          const currentUser = auth.getCurrentUser();

          // Fetch blocks for current user
          const blocksSnapshot = await firebase
            .firestore()
            .collection("blocks")
            .where("userId", "==", currentUser.uid)
            .get();

          ALL_BLOCKS = [];

          blocksSnapshot.forEach(function (doc) {
            const blockData = doc.data();
            ALL_BLOCKS.push({
              id: doc.id,
              blockId: blockData.blockId,
              blockName: blockData.blockName,
              section: blockData.section,
              area: blockData.area,

              // Latest scan data
              stage: blockData.stage || blockData.blockName || "Plant Crop",
              bearing: blockData.bearingPercent || 0,
              nonbearing: blockData.nonBearingPercent || 0,
              plants: blockData.totalPineapples || 0,
              nonViable: blockData.nonViable || 0,

              // Metadata
              lastScanned: blockData.lastScanned,
              totalScans: blockData.totalScans || 0,
            });
          });

          console.log("✅ Loaded", ALL_BLOCKS.length, "blocks from Firestore");

          renderBlocks();
        } catch (error) {
          console.error("❌ Error loading blocks:", error);
          ALL_BLOCKS = [];
          renderBlocks();
        }
      }

      // ── Filtering ────────────────────────────────────────────────────

      function setFilter(type, value, btn) {
        activeFilters[type] = value;
        document
          .querySelectorAll(`.filter-btn[data-filter="${type}"]`)
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderBlocks();
      }

      // ── Render Blocks Grid ───────────────────────────────────────────

      function renderBlocks() {
        let blocks = ALL_BLOCKS;
        const search = document.getElementById("blocks-search").value.trim().toLowerCase();
        if (search) {
          blocks = blocks.filter(function (block) {
            return [block.blockName, block.blockId, block.section].some(function (value) {
              return String(value || "").toLowerCase().includes(search);
            });
          });
        }

        // Apply status filter
        if (activeFilters.status !== "all") {
          blocks = blocks.filter(function (b) {
            const statusClass = getStatusClass(b.bearing);
            return statusClass === activeFilters.status;
          });
        }

        const grid = document.getElementById("blocks-grid");

        if (blocks.length === 0) {
          grid.innerHTML = `
                      <div class="empty-filter-state" style="width:100%;">
                          <div class="empty-filter-icon">
                              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                              </svg>
                          </div>
                          <div class="empty-filter-text">No blocks match the search and selected filters.</div>
                      </div>`;
          return;
        }

        grid.innerHTML = blocks
          .map(function (block) {
            const statusClass = getStatusClass(block.bearing);
            const barColorVal = getBarColor(block.bearing);
            const nonViableColor =
              block.nonViable > 10 ? "var(--red)" : "var(--amber)";

            return `
                      <div class="col">
                          <div class="bcard h-100" onclick="showBlockDetail('${block.id}')">
                              <div class="bcard-header">
                                  <div>
                                      <div class="bcard-number">${block.blockName || "BLOCK " + block.blockId}</div>
                                      <div class="bcard-stage">${block.stage}</div>
                                      <div class="bcard-meta">
                                          ${block.section} &middot; ${formatArea(block.area)}
                                          <div>${utils.recentScanBadge(block.lastScanned)}</div>
                                      </div>
                                  </div>
                                  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-xs);">
                                      ${statusBadge(statusClass)}
                                  </div>
                              </div>

                              <div class="bcard-bar-section">
                                  <div class="bcard-bar-label">Bearing rate</div>
                                  ${buildInlineBar(block.bearing, barColorVal)}
                              </div>

                              <div class="bcard-foot">
                                  <span class="bcard-foot-stat">${formatNumber(block.plants)} plants</span>
                                  <span class="bcard-foot-stat" style="color: ${nonViableColor};">${formatPercent(block.nonViable)} non-viable</span>
                                  <span class="bcard-foot-stat" style="color: var(--amber);">${formatPercent(block.nonbearing)} non-bearing</span>
                              </div>
                          </div>
                      </div>`;
          })
          .join("");
      }

      // ── Helper Functions ─────────────────────────────────────────────

      function getStatusClass(bearing) {
        if (bearing >= 80) return "good";
        if (bearing >= 60) return "warn";
        return "crit";
      }

      function getBarColor(bearing) {
        if (bearing >= 80) return "var(--green)";
        if (bearing >= 60) return "var(--amber)";
        return "var(--red)";
      }

      function statusBadge(status) {
        const labels = { good: "Healthy", warn: "Watch", crit: "Critical" };
        const colors = { good: "good", warn: "warn", crit: "crit" };
        return (
          '<span class="badge ' +
          colors[status] +
          '"><span class="bdot"></span>' +
          labels[status] +
          "</span>"
        );
      }

      function buildInlineBar(percent, color) {
        return (
          '<div class="bar-wrap"><div class="bar-fill" style="width:' +
          percent +
          "%;background:" +
          color +
          ';"></div></div><div class="bar-label">' +
          percent.toFixed(1) +
          "%</div>"
        );
      }

      function formatNumber(num) {
        return num.toLocaleString("en-US");
      }

      function formatPercent(num) {
        return num.toFixed(1) + "%";
      }

      function formatArea(area) {
        return area + " ha";
      }

      // ── Navigate to block detail page ────────────────────────────────

      function showBlockDetail(id) {
        window.location.href = "blocks-view.html?id=" + id;
      }

      // ── Modal helpers ────────────────────────────────────────────────

      function openAddBlockModal() {
        utils.showModal("add-block-modal");
      }

      function closeAddBlockModal() {
        utils.hideModal("add-block-modal");
        utils.resetForm("add-block-form");
      }

      async function handleAddBlock(event) {
        event.preventDefault();
        const formData = utils.getFormData("add-block-form");

        if (
          !formData.blockId ||
          !formData.daf ||
          !formData.section ||
          !formData.area ||
          !formData.planted ||
          !formData.forcingDate ||
          !formData.declaredPopulation
        ) {
          utils.showFormError(
            "add-block-form",
            "Please fill in all required fields",
          );
          return;
        }

        try {
          const currentUser = auth.getCurrentUser();

          // Create new block in Firestore
          await firebase
            .firestore()
            .collection("blocks")
            .add({
              blockId: formData.blockId,
              blockName: formData.blockId,
              userId: currentUser.uid,
              section: formData.section,
              area: parseFloat(formData.area),

              // Initial values - use parseFloat to force double type
              stage: formData.daf + " DAF",
              daf: parseInt(formData.daf),
              bearingPercent: 0.01,
              nonBearingPercent: 0.01,
              totalPineapples: INCLUDE_DECLARED_POPULATION ? parseInt(formData.declaredPopulation) : 0,
              nonViable: 0.01,

              // Metadata
              planted: formData.planted,
              forcingDate: formData.forcingDate,
              declaredPopulation: parseInt(formData.declaredPopulation),
              totalScans: 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });

          utils.showToast("Block added successfully!", "success");
          closeAddBlockModal();
          await loadBlocksFromFirebase();
        } catch (error) {
          console.error("Error adding block:", error);
          utils.showFormError(
            "add-block-form",
            "Failed to add block: " + error.message,
          );
        }
      }
    </script>
  </body>
</html>
