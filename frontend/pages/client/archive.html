<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive - PineVision</title>
  <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/layout.css"><link rel="stylesheet" href="../../css/components.css">
  <style>
    .archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
    .archive-card{background:var(--color-background-primary,#fff);border:1px solid var(--color-border-primary,#e5e7eb);border-radius:12px;padding:18px;box-shadow:0 2px 8px #1220190a}
    .archive-badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#f1f5f2;color:#45634e;font-size:12px;font-weight:600}
    .archive-card h2{font-size:18px;margin:12px 0 3px;color:var(--color-text-primary)}
    .archive-section{color:var(--color-text-secondary);font-size:13px;margin-bottom:15px}
    .archive-details{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
    .archive-details span{display:block;color:var(--color-text-tertiary);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .archive-details strong{display:block;color:var(--color-text-primary);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
    .archive-actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--color-border-primary,#e5e7eb);padding-top:14px;margin-top:16px}
    .archive-empty,.archive-loading{padding:36px 16px;text-align:center;color:var(--color-text-secondary)}
    .archive-modal-backdrop{position:fixed;inset:0;background:#10181480;display:none;align-items:center;justify-content:center;padding:16px;z-index:1100}
    .archive-modal-backdrop.open{display:flex}.archive-modal{background:#fff;color:#202722;width:min(680px,100%);max-height:85vh;overflow:auto;border-radius:14px;padding:22px}
    .archive-modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.archive-modal h2{font-size:20px;margin:0}
    .archive-modal section{border-top:1px solid #e7ebe8;padding:14px 0}.archive-modal h3{font-size:14px}.archive-modal dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}.archive-modal dt{font-size:11px;color:#68736c}.archive-modal dd{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar"><div class="sidebar-brand"><div class="sidebar-logo"><img src="/frontend/assets/images/pinevision-transparent-logo.svg" alt="PineVision" class="sidebar-logo-img" width="56" height="56"></div><div class="sidebar-brand-text"><div class="sidebar-brand-name">PineVision</div><div class="sidebar-brand-tagline">Farm Monitoring</div></div></div>
    <button class="sidebar-collapse-btn" onclick="app.toggleSidebar()" aria-label="Toggle sidebar"><span>‹</span><span class="nav-link-text">Collapse sidebar</span></button>
    <nav class="sidebar-nav"><div class="nav-section"><div class="nav-section-title">Main Menu</div><ul class="nav-links"><li><a href="dashboard.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-dashboard.svg" alt="" width="20"></span><span class="nav-link-text">Dashboard</span></a></li><li><a href="blocks.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-leaf.svg" alt="" width="20"></span><span class="nav-link-text">Fruit Blocks</span></a></li><li><a href="scans.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-clipboard.svg" alt="" width="20"></span><span class="nav-link-text">Scan Log</span></a></li><li><a href="alerts.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-bell.svg" alt="" width="20"></span><span class="nav-link-text">Alerts</span></a></li><li><a href="settings.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-cog.svg" alt="" width="20"></span><span class="nav-link-text">Settings</span></a></li></ul></div><div class="nav-section"><div class="nav-section-title">Field Operations</div><ul class="nav-links"><li><a href="reports.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/report.svg" alt="" width="20"></span><span class="nav-link-text">Reports</span></a></li></ul></div></nav>
  </aside>
  <main class="main-content"><header class="topbar"><div class="topbar-page"><span class="topbar-page-icon" aria-hidden="true"></span><div class="topbar-page-text"><h1 class="topbar-page-title"></h1><p class="topbar-page-subtitle"></p></div></div><div class="topbar-account"><button type="button" class="topbar-account-trigger" id="topbar-account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="topbar-account-menu"><span class="topbar-account-avatar"></span><span class="topbar-account-info"><span class="topbar-account-name"></span><span class="topbar-account-role"></span></span><span>⌄</span></button><div class="topbar-account-menu" id="topbar-account-menu" role="menu" hidden><div class="topbar-account-menu-header"><div class="topbar-account-menu-name"></div><div class="topbar-account-menu-email"></div></div><button class="topbar-account-logout" role="menuitem" onclick="app.handleTopbarLogout()">Logout</button></div></div></header>
    <div class="container-fluid py-4 px-4 page-container"><p class="text-secondary">Archived blocks remain available here until restored or permanently deleted.</p><div id="archive-loading" class="archive-loading">Loading archived blocks…</div><div id="archive-grid" class="archive-grid"></div><div id="archive-empty" class="archive-empty" hidden>No archived blocks yet.</div></div>
  </main>
</div>
<div id="archive-modal-backdrop" class="archive-modal-backdrop" role="presentation"><div class="archive-modal" role="dialog" aria-modal="true" aria-labelledby="archive-modal-title"><header><h2 id="archive-modal-title">Archived block details</h2><button class="btn btn-sm btn-outline-secondary" onclick="closeArchiveDetails()" aria-label="Close">Close</button></header><div id="archive-modal-content"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="../../js/auth.js"></script><script src="../../js/utils.js"></script><script src="../../js/app.js"></script>
<script>
if (!auth.requireAuth()) { /* auth redirects */ }
let archivedBlocks=[];
window.initPage=async function(){const user=auth.getCurrentUser(),session=auth.getSession();if(!user||session?.role!=='client'){const home=session?.role==='admin'?'/admin/dashboard.html':session?.role==='farm_manager'?'/farm-manager/dashboard.html':'/index.html';window.location.href=home;return;}await loadArchive(user.uid);};
function safe(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(v){if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString();}
async function loadArchive(uid){const loading=document.getElementById('archive-loading'),grid=document.getElementById('archive-grid'),empty=document.getElementById('archive-empty');loading.hidden=false;grid.innerHTML='';empty.hidden=true;try{const snap=await firebase.firestore().collection('blocks').where('userId','==',uid).get();archivedBlocks=snap.docs.map(doc=>({id:doc.id,...doc.data()})).filter(b=>b.isDeleted===true);loading.hidden=true;if(!archivedBlocks.length){empty.hidden=false;return;}grid.innerHTML=archivedBlocks.map(cardHtml).join('');}catch(e){console.error('❌ Failed to load archive:',e);loading.textContent='Could not load Archive. Please refresh and try again.';}}
function cardHtml(b){return `<article class="archive-card" data-block-id="${safe(b.id)}"><span class="archive-badge">Archived</span><h2>${safe(b.blockName||b.blockId)}</h2><div class="archive-section">${safe(b.section||'No section')}</div><div class="archive-details"><div><span>Area</span><strong>${safe(b.area==null?'—':b.area+' ha')}</strong></div><div><span>Date deleted</span><strong>${safe(dateText(b.deletedAt))}</strong></div><div><span>Planting date</span><strong>${safe(dateText(b.planted))}</strong></div><div><span>Forcing date</span><strong>${safe(dateText(b.forcingDate))}</strong></div><div><span>DAF</span><strong>${safe(b.daf??'—')}</strong></div><div><span>Crop cycle</span><strong>${safe(b.activeCycleId||'—')}</strong></div></div><div class="archive-actions"><button class="btn btn-sm btn-primary" onclick="restoreBlock('${safe(b.id)}')">Restore</button><button class="btn btn-sm btn-outline-secondary" onclick="showArchiveDetails('${safe(b.id)}')">View Details</button><button class="btn btn-sm btn-outline-danger" onclick="permanentlyDeleteBlock('${safe(b.id)}')">Delete Permanently</button></div></article>`;}
async function apiBlockAction(id,action,method='POST'){const user=firebase.auth().currentUser;if(!user)throw Error('Sign in again to continue');const token=await user.getIdToken();const response=await fetch(`/api/client/blocks/${encodeURIComponent(id)}/${action}`,{method,headers:{Authorization:`Bearer ${token}`}});const result=await response.json();if(!response.ok)throw Error(result.error||'The operation failed');return result;}
function setCardBusy(id,busy){const card=document.querySelector(`[data-block-id="${CSS.escape(id)}"]`);if(card)card.querySelectorAll('button').forEach(button=>{button.disabled=busy;});}
async function restoreBlock(id){setCardBusy(id,true);try{await apiBlockAction(id,'restore');utils.showToast('Block restored.','success');await loadArchive(auth.getCurrentUser().uid);}catch(e){console.error(e);setCardBusy(id,false);utils.showToast(e.message||'Failed to restore block.','error');}}
async function permanentlyDeleteBlock(id){const block=archivedBlocks.find(b=>b.id===id);if(!block||!confirm(`Permanently delete “${block.blockName||block.blockId}”? This cannot be undone. The block and associated crop cycle, scan, and monitoring alert records will be removed. Audit log entries are retained.`))return;setCardBusy(id,true);try{await apiBlockAction(id,'permanent','DELETE');utils.showToast('Block permanently deleted.','success');await loadArchive(auth.getCurrentUser().uid);}catch(e){console.error(e);setCardBusy(id,false);utils.showToast(e.message||'Permanent deletion failed. You can retry from Archive.','error');}}
async function showArchiveDetails(id){const b=archivedBlocks.find(x=>x.id===id);if(!b)return;const fields=(obj)=>Object.entries(obj).map(([k,v])=>`<div><dt>${safe(k.replace(/([A-Z])/g,' $1'))}</dt><dd>${safe(v==null||v===''?'—':typeof v==='object'?dateText(v):v)}</dd></div>`).join('');const content=document.getElementById('archive-modal-content');content.innerHTML=`<section><h3>General information</h3><dl>${fields({'Block Name':b.blockName||b.blockId,Section:b.section,Area:b.area==null?'—':b.area+' ha',Created:b.createdAt?dateText(b.createdAt):'—',Deleted:dateText(b.deletedAt)})}</dl></section><section><h3>Crop &amp; growth details</h3><dl>${fields({'Planting Date':b.planted, 'Forcing Date':b.forcingDate,DAF:b.daf,'Current Crop Cycle':b.activeCycleId})}</dl><div class="small text-secondary mt-2" id="archive-cycles">Loading crop cycle history…</div></section><section><h3>Additional information</h3><dl>${fields({'Registered Population':b.registeredPopulation??b.totalPineapples,'Total Scans':b.totalScans,Stage:b.stage,'Last Scanned':b.lastScanned?dateText(b.lastScanned):'—','Block ID':id})}</dl></section>`;document.getElementById('archive-modal-backdrop').classList.add('open');try{const snap=await firebase.firestore().collection('cropCycles').where('blockId','==',id).get();const history=document.getElementById('archive-cycles');if(!history)return;if(snap.empty){history.textContent='No previous crop cycles recorded.';return;}history.innerHTML='<strong>Crop cycle history</strong><ul>'+snap.docs.map(doc=>{const d=doc.data();return `<li>${safe(d.planted||d.startDate||'Unknown date')} · ${safe(d.status||'recorded')}${d.forcingDate?' · Forcing '+safe(d.forcingDate):''}${d.daf!=null?' · '+safe(d.daf)+' DAF':''}</li>`;}).join('')+'</ul>';}catch(e){console.error('❌ Could not load crop cycle history:',e);const history=document.getElementById('archive-cycles');if(history)history.textContent='Crop cycle history could not be loaded.';}}
function closeArchiveDetails(){document.getElementById('archive-modal-backdrop').classList.remove('open');}
document.getElementById('archive-modal-backdrop').addEventListener('click',e=>{if(e.target.id==='archive-modal-backdrop')closeArchiveDetails();});
</script>
</body></html>
