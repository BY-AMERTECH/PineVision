<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive - PineVision</title>
  <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/layout.css"><link rel="stylesheet" href="../../css/components.css">
  <style>
    .archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:stretch}
    .archive-card{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--color-background-primary,#fff);border:1px solid var(--color-border-primary,#e5e7eb);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px #1220190a}
    .archive-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}
    .archive-card-identity{min-width:0;flex:1}
    .archive-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
    .archive-block-icon{display:inline-flex;flex:none;color:var(--green,#39764d)}
    .archive-block-icon svg{width:16px;height:16px}
    .archive-card h2{font-size:17px;line-height:1.3;font-weight:600;margin:0;color:var(--color-text-primary);overflow-wrap:anywhere}
    .archive-badge{display:inline-flex;padding:2px 7px;border-radius:999px;background:#f1f5f2;color:#45634e;font-size:10px;font-weight:600;white-space:nowrap}
    .archive-section{color:var(--color-text-secondary);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
    .archive-view-button{flex:none;white-space:nowrap}
    .archive-header-actions{display:flex;align-items:center;gap:7px;flex:none}
    .archive-info-group{margin-top:12px}
    .archive-info-heading{font-size:12px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;color:var(--color-text-secondary);margin:0 0 8px}
    .archive-details{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;border-top:1px solid var(--color-border-primary,#e5e7eb);padding-top:8px}
    .archive-field{min-width:0;padding-right:7px;border-right:1px solid #edf0ed}
    .archive-field:nth-child(5n){border-right:0;padding-right:0}
    .archive-field:last-child{border-right:0;padding-right:0}
    .archive-details span{display:block;color:var(--color-text-tertiary);font-size:11px;line-height:1.3;text-transform:uppercase;letter-spacing:.025em}
    .archive-details strong{display:block;color:var(--color-text-primary);font-size:14px;line-height:1.4;font-weight:500;margin-top:4px;overflow-wrap:anywhere}
    .archive-card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 0;border-top:1px solid var(--color-border-primary,#e5e7eb)}
    .archive-deleted-group{display:flex;align-items:center;gap:15px;min-width:0}
    .archive-deleted-group .archive-info-heading{font-size:11px;margin:0;white-space:nowrap}
    .archive-deleted-group strong{font-size:14px;font-weight:600;color:var(--color-text-primary);text-align:right}
    .archive-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px}
    .archive-actions .btn{font-size:13px;padding:5px 10px;line-height:1.35;background:transparent}
    .archive-actions .btn-outline-success{border:1px solid #198754;background:#198754;color:#fff}
    .archive-actions .btn-outline-success:hover{background:#146c43;border-color:#146c43;color:#fff}
    .archive-actions .btn-outline-danger{border:0;background:transparent;color:#dc3545}
    .archive-actions .btn-outline-danger:hover{background:#dc3545;border:0;color:#fff}
    .archive-actions .btn-outline-success,.archive-actions .btn-outline-danger{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
    @media(max-width:600px){.archive-card{padding:13px;min-height:0}.archive-view-button{font-size:11px;padding:4px 7px}}
    .fb-search{position:relative;flex:1;min-width:220px;max-width:360px}
    .fb-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
    .fb-search input{width:100%;padding:8px 36px 8px 34px;font-size:var(--font-size-sm);border:1px solid var(--color-border-primary);border-radius:var(--radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
    .fb-search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
    .fb-search input::placeholder{color:var(--color-text-tertiary)}
    .filter-bar{display:flex;flex-wrap:wrap;gap:var(--space-lg);align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background-color:var(--surf);border:var(--border-width-base) solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px}
    .filter-bar-actions{display:flex;align-items:center;gap:var(--space-sm);margin-left:auto}
    .filter-bar-actions .form-select{width:auto;min-width:150px}
    .archive-filter-bar{display:block}
    .archive-filter-controls{display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg)}
    .archive-filter-controls .filter-bar-actions{align-self:flex-start}
    .archive-search-stack{display:flex;align-items:center;flex:1;min-width:220px;max-width:none;gap:15px}
    .archive-search-stack .fb-search{flex:1;min-width:220px;max-width:360px}
    .archive-search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--color-text-tertiary);font-size:20px;line-height:1;padding:3px 6px}
    .archive-search-clear:hover{color:var(--color-text-primary)}
    .archive-info-hint{display:flex;justify-content:center;flex:none;margin:0}
    .archive-info-button{position:relative;display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--color-text-secondary);cursor:help}
    .archive-info-button:hover,.archive-info-button:focus-visible{background:var(--green-bg,#edf5ef);color:var(--green,#39764d);outline:none}
    .archive-info-button svg{width:17px;height:17px}
    .archive-info-tooltip{position:absolute;right:0;bottom:calc(100% + 8px);z-index:1200;width:max-content;max-width:min(280px,calc(100vw - 40px));padding:9px 11px;border-radius:7px;background:#26332b;color:#fff;text-align:left;font-size:12px;line-height:1.4;box-shadow:0 4px 12px #12201930;visibility:hidden;opacity:0;transition:opacity .12s ease}
    .archive-info-button:hover .archive-info-tooltip,.archive-info-button:focus-visible .archive-info-tooltip{visibility:visible;opacity:1}
    @media(max-width:640px){.archive-filter-controls{align-items:stretch;flex-direction:column;gap:var(--space-md)}.archive-search-stack{min-width:0;max-width:none;width:100%}.archive-search-stack .fb-search{min-width:0;max-width:none}}
    @media(max-width:580px){.filter-bar{gap:var(--space-md)}.filter-bar-actions{width:100%;margin-left:0;align-self:stretch;flex-direction:column;align-items:stretch}.filter-bar-actions .form-select{width:100%;min-width:0}}
    @media(max-width:600px){.archive-details{gap:8px 5px}.archive-field{padding-right:4px}.archive-details span{font-size:10px}.archive-details strong{font-size:12px}.archive-card-footer{align-items:flex-start;flex-direction:column}.archive-actions{width:100%}.archive-actions .btn{white-space:nowrap}}
    .archive-no-results{padding:28px 16px;text-align:center;color:var(--color-text-secondary)}
    .archive-empty,.archive-loading{padding:36px 16px;text-align:center;color:var(--color-text-secondary)}
    .archive-modal-backdrop{position:fixed;inset:0;background:#10181480;display:none;align-items:center;justify-content:center;padding:16px;z-index:1100}
    .archive-modal-backdrop.open{display:flex}.archive-modal{background:#fff;color:#202722;width:min(680px,100%);max-height:85vh;overflow:auto;border-radius:14px;padding:22px}
    .archive-modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.archive-modal h2{font-size:20px;margin:0}
    .archive-modal section{border-top:1px solid #e7ebe8;padding:14px 0}.archive-modal h3{font-size:14px}.archive-modal dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}.archive-modal dt{font-size:11px;color:#68736c}.archive-modal dd{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
    .archive-confirm-copy{line-height:1.55;margin:0 0 12px}.archive-confirm-warning{color:#9f2f2f;background:#fff1f0;border:1px solid #f3c4c0;border-radius:8px;padding:10px 12px;font-size:13px}.archive-confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    @media(max-width:480px){.archive-modal{padding:16px}.archive-modal dl{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar"><div class="sidebar-brand"><div class="sidebar-logo"><img src="/frontend/assets/images/pinevision-transparent-logo.svg" alt="PineVision" class="sidebar-logo-img" width="56" height="56"></div><div class="sidebar-brand-text"><div class="sidebar-brand-name">PineVision</div><div class="sidebar-brand-tagline">Farm Monitoring</div></div></div>
    <button class="sidebar-collapse-btn" onclick="app.toggleSidebar()" aria-label="Toggle sidebar"><span>‹</span><span class="nav-link-text">Collapse sidebar</span></button>
    <nav class="sidebar-nav"><div class="nav-section"><div class="nav-section-title">Main Menu</div><ul class="nav-links"><li><a href="dashboard.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-dashboard.svg" alt="" width="20"></span><span class="nav-link-text">Dashboard</span></a></li><li><a href="blocks.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-leaf.svg" alt="" width="20"></span><span class="nav-link-text">Fruit Blocks</span></a></li><li><a href="scans.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-clipboard.svg" alt="" width="20"></span><span class="nav-link-text">Scan Log</span></a></li><li><a href="alerts.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-bell.svg" alt="" width="20"></span><span class="nav-link-text">Alerts</span></a></li><li><a href="settings.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/nav-cog.svg" alt="" width="20"></span><span class="nav-link-text">Settings</span></a></li></ul></div><div class="nav-section"><div class="nav-section-title">Field Operations</div><ul class="nav-links"><li><a href="reports.html" class="nav-link"><span class="nav-link-icon"><img src="/frontend/assets/icons/report.svg" alt="" width="20"></span><span class="nav-link-text">Reports</span></a></li></ul></div></nav>
  </aside>
  <main class="main-content"><header class="topbar"><div class="topbar-page"><span class="topbar-page-icon" aria-hidden="true"></span><div class="topbar-page-text"><h1 class="topbar-page-title"></h1><p class="topbar-page-subtitle"></p></div></div><div class="topbar-account"><button type="button" class="topbar-account-trigger" id="topbar-account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="topbar-account-menu"><span class="topbar-account-avatar"></span><span class="topbar-account-info"><span class="topbar-account-name"></span><span class="topbar-account-role"></span></span><span>⌄</span></button><div class="topbar-account-menu" id="topbar-account-menu" role="menu" hidden><div class="topbar-account-menu-header"><div class="topbar-account-menu-name"></div><div class="topbar-account-menu-email"></div></div><button class="topbar-account-logout" role="menuitem" onclick="app.handleTopbarLogout()">Logout</button></div></div></header>
    <div class="container-fluid py-4 px-4 page-container"><div class="filter-bar archive-filter-bar"><div class="archive-filter-controls"><div class="archive-search-stack"><div class="fb-search"><span class="fb-search-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="search" id="archive-search" aria-label="Search archived blocks by block name or section" placeholder="Search blocks..." oninput="renderArchiveCards()"><button id="archive-search-clear" class="archive-search-clear" type="button" aria-label="Clear search" title="Clear search" onclick="clearArchiveSearch()" hidden>&times;</button></div><div class="archive-info-hint"><button type="button" class="archive-info-button" aria-label="Archived blocks remain available here until restored or permanently deleted" aria-describedby="archive-info-tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><span id="archive-info-tooltip" class="archive-info-tooltip" role="tooltip">Archived blocks remain available here until restored or permanently deleted.</span></button></div></div><div class="filter-bar-actions"><select id="archive-sort" class="form-select form-select-sm" aria-label="Sort by deletion date" onchange="renderArchiveCards()"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div></div><div id="archive-loading" class="archive-loading">Loading archived blocks…</div><div id="archive-grid" class="archive-grid"></div><div id="archive-empty" class="archive-no-results" hidden>No archived blocks yet.</div></div>
  </main>
</div>
<div id="archive-modal-backdrop" class="archive-modal-backdrop" role="presentation"><div class="archive-modal" role="dialog" aria-modal="true" aria-labelledby="archive-modal-title"><header><h2 id="archive-modal-title">Archived block details</h2><button class="btn btn-sm btn-outline-secondary" onclick="closeArchiveDetails()" aria-label="Close">Close</button></header><div id="archive-modal-content"></div></div></div>
<div id="archive-confirm-backdrop" class="archive-modal-backdrop" role="presentation" aria-hidden="true"><div class="archive-modal" role="dialog" aria-modal="true" aria-labelledby="archive-confirm-title" aria-describedby="archive-confirm-copy archive-confirm-warning"><header><h2 id="archive-confirm-title">Confirm action</h2></header><p id="archive-confirm-copy" class="archive-confirm-copy"></p><p id="archive-confirm-warning" class="archive-confirm-warning" hidden></p><div class="archive-confirm-actions"><button type="button" id="archive-confirm-cancel" class="btn btn-sm btn-outline-secondary" onclick="finishArchiveConfirmation(false)">Cancel</button><button type="button" id="archive-confirm-accept" class="btn btn-sm btn-primary" onclick="finishArchiveConfirmation(true)">Confirm</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="../../js/auth.js"></script><script src="../../js/utils.js"></script><script src="../../js/app.js"></script>
<script>
if (!auth.requireAuth()) { /* auth redirects */ }
let archivedBlocks=[];
let archiveConfirmationResolver=null;
let archiveConfirmationFocusTarget=null;
window.initPage=async function(){const user=auth.getCurrentUser(),session=auth.getSession();if(!user||session?.role!=='client'){const home=session?.role==='admin'?'/admin/dashboard.html':session?.role==='farm_manager'?'/farm-manager/dashboard.html':'/index.html';window.location.href=home;return;}await loadArchive(user.uid);};
function safe(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function archiveDate(v){if(!v)return null;let d;if(v&&typeof v.toDate==='function')d=v.toDate();else if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)){const [year,month,day]=v.split('-').map(Number);d=new Date(year,month-1,day);}else d=new Date(v);return Number.isNaN(d.getTime())?null:d;}
function dateText(v){const d=archiveDate(v);return d?d.toLocaleDateString('en-US',{month:'long',day:'2-digit',year:'numeric'}):'—';}
function archiveDeletedTime(v){const d=archiveDate(v);return d?d.getTime():null;}
async function loadArchive(uid){const loading=document.getElementById('archive-loading'),grid=document.getElementById('archive-grid'),empty=document.getElementById('archive-empty');loading.hidden=false;grid.innerHTML='';empty.hidden=true;try{const snap=await firebase.firestore().collection('blocks').where('userId','==',uid).get();archivedBlocks=snap.docs.map(doc=>({id:doc.id,...doc.data()})).filter(b=>b.isDeleted===true);loading.hidden=true;renderArchiveCards();}catch(e){console.error('❌ Failed to load archive:',e);loading.textContent='Could not load Archive. Please refresh and try again.';}}
function renderArchiveCards(){const grid=document.getElementById('archive-grid'),empty=document.getElementById('archive-empty'),loading=document.getElementById('archive-loading'),search=document.getElementById('archive-search'),clear=document.getElementById('archive-search-clear'),query=(search?.value||'').trim().toLocaleLowerCase(),sort=document.getElementById('archive-sort')?.value||'newest';if(clear)clear.hidden=!query;const matches=archivedBlocks.filter(b=>`${b.blockName||b.blockId||''} ${b.section||''}`.toLocaleLowerCase().includes(query));matches.sort((a,b)=>{const aTime=archiveDeletedTime(a.deletedAt),bTime=archiveDeletedTime(b.deletedAt);if(aTime===null&&bTime===null)return 0;if(aTime===null)return 1;if(bTime===null)return -1;return sort==='oldest'?aTime-bTime:bTime-aTime;});grid.innerHTML=matches.map(cardHtml).join('');empty.hidden=matches.length>0||!loading.hidden;empty.textContent=archivedBlocks.length===0?'No archived blocks yet.':query?'No archived blocks match your search.':'No archived blocks yet.';}
function clearArchiveSearch(){const search=document.getElementById('archive-search');search.value='';renderArchiveCards();search.focus();}
function cardHtml(b){return `<article class="archive-card" data-block-id="${safe(b.id)}"><div class="archive-card-header"><div class="archive-card-identity"><div class="archive-title-row"><span class="archive-block-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v4H3z"/><path d="M5 8v12h14V8"/><path d="M9 12h6"/></svg></span><h2>${safe(b.blockName||b.blockId)}</h2><span class="archive-badge">Archived</span></div><div class="archive-section">${safe(b.section||'No section')}</div></div><div class="archive-header-actions"><button class="btn btn-sm btn-outline-secondary archive-view-button" onclick="showArchiveDetails('${safe(b.id)}')">View Details</button></div></div><section class="archive-info-group"><h3 class="archive-info-heading">Block Details</h3><div class="archive-details"><div class="archive-field"><span>Area</span><strong>${safe(b.area==null?'—':b.area+' ha')}</strong></div><div class="archive-field"><span>Planting Date</span><strong>${safe(dateText(b.planted))}</strong></div><div class="archive-field"><span>Forcing Date</span><strong>${safe(dateText(b.forcingDate))}</strong></div><div class="archive-field"><span>DAF</span><strong>${safe(b.daf??'—')}</strong></div><div class="archive-field"><span>Crop Cycle</span><strong>${safe(b.activeCycleId||'—')}</strong></div></div></section><div class="archive-card-footer"><div class="archive-deleted-group"><span class="archive-info-heading">Date Deleted</span><strong>${safe(dateText(b.deletedAt))}</strong></div><div class="archive-actions"><button class="btn btn-sm btn-outline-danger" onclick="permanentlyDeleteBlock('${safe(b.id)}')">Delete Permanently</button><button class="btn btn-sm btn-outline-success" onclick="restoreBlock('${safe(b.id)}')">Restore</button></div></div></article>`;}
async function apiBlockAction(id,action,method='POST'){const user=firebase.auth().currentUser;if(!user)throw Error('Sign in again to continue');const token=await user.getIdToken();const response=await fetch(`https://pinevision-backend.whiteisland-36ad8831.eastasia.azurecontainerapps.io/api/client/blocks/${encodeURIComponent(id)}/${action}`,{method,headers:{Authorization:`Bearer ${token}`}});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||`Request failed (${response.status})`);return result;}
function setCardBusy(id,busy){const card=document.querySelector(`[data-block-id="${CSS.escape(id)}"]`);if(card)card.querySelectorAll('button').forEach(button=>{button.disabled=busy;});}
function askArchiveConfirmation(block,action){const deleting=action==='delete',name=block.blockName||block.blockId||'this block',backdrop=document.getElementById('archive-confirm-backdrop'),accept=document.getElementById('archive-confirm-accept');document.getElementById('archive-confirm-title').textContent=deleting?'Delete permanently?':'Restore block?';document.getElementById('archive-confirm-copy').textContent=deleting?`Are you sure you want to permanently delete “${name}”?`:`Restore “${name}” to active Blocks?`;const warning=document.getElementById('archive-confirm-warning');warning.hidden=!deleting;warning.textContent=deleting?'This cannot be undone. The block and its crop cycle, scan, and monitoring alert records will be removed. Audit log entries are retained.':'';accept.textContent=deleting?'Delete Permanently':'Restore Block';accept.className='btn btn-sm '+(deleting?'btn-danger':'btn-primary');archiveConfirmationFocusTarget=document.activeElement;backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');return new Promise(resolve=>{archiveConfirmationResolver=resolve;accept.focus();});}
function finishArchiveConfirmation(confirmed){const backdrop=document.getElementById('archive-confirm-backdrop');backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');const resolve=archiveConfirmationResolver;archiveConfirmationResolver=null;const focusTarget=archiveConfirmationFocusTarget;archiveConfirmationFocusTarget=null;if(focusTarget?.isConnected)requestAnimationFrame(()=>{if(focusTarget.isConnected&&!focusTarget.disabled)focusTarget.focus();});if(resolve)resolve(confirmed);}
async function restoreBlock(id){const block=archivedBlocks.find(b=>b.id===id);if(!block)return;setCardBusy(id,true);if(!await askArchiveConfirmation(block,'restore')){setCardBusy(id,false);return;}try{await apiBlockAction(id,'restore');utils.showToast('Block restored.','success');await loadArchive(auth.getCurrentUser().uid);}catch(e){console.error(e);setCardBusy(id,false);utils.showToast(e.message||'Failed to restore block.','error');}}
async function permanentlyDeleteBlock(id){const block=archivedBlocks.find(b=>b.id===id);if(!block)return;setCardBusy(id,true);if(!await askArchiveConfirmation(block,'delete')){setCardBusy(id,false);return;}try{await apiBlockAction(id,'permanent','DELETE');utils.showToast('Block permanently deleted.','success');await loadArchive(auth.getCurrentUser().uid);}catch(e){console.error(e);setCardBusy(id,false);utils.showToast(e.message||'Permanent deletion failed. You can retry from Archive.','error');}}
function showArchiveDetails(id){const b=archivedBlocks.find(x=>x.id===id);if(!b)return;const fields=(obj)=>Object.entries(obj).map(([k,v])=>`<div><dt>${safe(k)}</dt><dd>${safe(v==null||v===''?'—':v)}</dd></div>`).join('');const content=document.getElementById('archive-modal-content');content.innerHTML=`<section><h3>General information</h3><dl>${fields({'Block Name':b.blockName||b.blockId,Section:b.section||'—',Area:b.area==null?'—':b.area+' ha','Date Created':dateText(b.createdAt),'Date Deleted':dateText(b.deletedAt)})}</dl></section><section><h3>Crop &amp; growth details</h3><dl>${fields({'Planting Date':dateText(b.planted),'Forcing Date':dateText(b.forcingDate),'Days After Forcing (DAF)':b.daf,'Current Crop Cycle':b.activeCycleId})}</dl></section><section><h3>Additional information</h3><dl>${fields({'Total Scans':b.totalScans,'Last Scanned':dateText(b.lastScanned)})}</dl></section>`;document.getElementById('archive-modal-backdrop').classList.add('open');}
function closeArchiveDetails(){document.getElementById('archive-modal-backdrop').classList.remove('open');}
document.getElementById('archive-modal-backdrop').addEventListener('click',e=>{if(e.target.id==='archive-modal-backdrop')closeArchiveDetails();});
document.getElementById('archive-confirm-backdrop').addEventListener('click',e=>{if(e.target.id==='archive-confirm-backdrop')finishArchiveConfirmation(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&archiveConfirmationResolver)finishArchiveConfirmation(false);});
</script>
