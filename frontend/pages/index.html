<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <title>PineVision | Sign In</title>
  <link rel="icon" type="image/x-icon" href="/frontend/assets/images/pinevision-favicon.ico" />
  <link rel="icon" type="image/webp" sizes="64x64" href="/frontend/assets/images/pinevision-favicon.webp" />
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/pinevision-touch-icon.png" />
  <link rel="stylesheet" href="../css/auth.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="auth-bg">

    <!-- Brand above card -->
    <div class="auth-brand">
      <img class="auth-brand-logo"
           src="/frontend/assets/images/pinevision-transparent-logo.svg"
           alt="PineVision" width="80" height="80" fetchpriority="high" />
      <div class="auth-brand-name">PineVision</div>
      <div class="auth-brand-tagline">Pineapple Farm Monitoring System</div>
    </div>

    <!-- Glass card -->
    <div class="login-card">
      <h1 class="login-card-title">Welcome Back</h1>
      <p class="login-card-subtitle">Sign in to access your farm dashboard</p>

      <!-- Error Banner -->
      <div id="error-message" class="error-message" style="display: none" role="alert" aria-live="assertive">
        <span class="error-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </span>
        <span id="error-text"></span>
      </div>

      <!-- Role Tab Switcher -->
      <div class="login-tabs" role="tablist" aria-label="Select login role">
        <button class="login-tab active" id="tab-client" role="tab" aria-selected="true" data-role="client">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          User
        </button>
        <button class="login-tab" id="tab-farm-manager" role="tab" aria-selected="false" data-role="farm_manager">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Farm Manager
        </button>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="username" class="form-input has-icon"
              placeholder="Enter your username"
              autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrap input-icon-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="password" class="form-input has-icon"
              placeholder="Enter your password"
              autocomplete="current-password" required />
            <button type="button" class="btn-eye" id="btn-eye" aria-label="Show password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" />
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" style="display: none" aria-hidden="true">
            <span class="spinner"></span>
            Signing in&hellip;
          </span>
        </button>
      </form>
    </div>

    <!-- Super Admin access -->
    <button type="button" class="auth-superadmin" id="btn-superadmin" aria-label="Super Admin login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      Super Admin access
    </button>

    <dialog id="forgot-password-dialog" class="forgot-dialog" aria-labelledby="forgot-password-title">
      <form id="forgot-password-form" class="forgot-dialog-form">
        <h2 id="forgot-password-title" class="login-card-title">Reset your password</h2>
        <p class="forgot-dialog-description">Enter your username or email and we’ll send a reset link if an account matches.</p>
        <label class="form-label" for="forgot-password-identifier">Username or email</label>
        <input id="forgot-password-identifier" class="form-input" type="text" autocomplete="username" required>
        <p id="forgot-password-status" class="forgot-dialog-status" role="status" aria-live="polite"></p>
        <div class="forgot-dialog-actions">
          <button type="button" id="forgot-password-cancel" class="forgot-dialog-cancel">Cancel</button>
          <button type="button" id="forgot-password-done" class="forgot-dialog-cancel" hidden>Done</button>
          <button type="submit" id="forgot-password-submit" class="forgot-dialog-submit">Send reset link</button>
        </div>
      </form>
    </dialog>

  </div>

  <script src="../js/auth.js"></script>
  <script>
    (function () {
      "use strict";

      // Redirect to dashboard immediately if a valid session exists
      auth.checkExistingSession();

      var form          = document.getElementById("login-form");
      var usernameInput = document.getElementById("username");
      var passwordInput = document.getElementById("password");
      var rememberInput = document.getElementById("remember-me");
      var btnEye        = document.getElementById("btn-eye");
      var btnSuperAdmin = document.getElementById("btn-superadmin");
      var forgotLink    = document.querySelector(".forgot-link");
      var formOptions   = document.querySelector(".form-options");
      var forgotDialog  = document.getElementById("forgot-password-dialog");
      var forgotForm    = document.getElementById("forgot-password-form");
      var forgotInput   = document.getElementById("forgot-password-identifier");
      var forgotStatus  = document.getElementById("forgot-password-status");
      var forgotSubmit  = document.getElementById("forgot-password-submit");
      var forgotDone    = document.getElementById("forgot-password-done");
      var forgotCancel  = document.getElementById("forgot-password-cancel");
      var tabs          = document.querySelectorAll(".login-tab");
      var selectedRole  = "client";

      formOptions.removeChild(forgotLink);

      forgotLink.addEventListener("click", function (event) {
        event.preventDefault();
        forgotInput.value = usernameInput.value.trim();
        forgotStatus.textContent = "";
        forgotDone.hidden = true;
        forgotSubmit.hidden = false;
        forgotCancel.hidden = false;
        forgotDialog.showModal();
        forgotInput.focus();
      });

      document.getElementById("forgot-password-cancel").addEventListener("click", function () {
        forgotDialog.close();
      });

      forgotDone.addEventListener("click", function () {
        forgotDialog.close();
      });

      forgotForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var identifier = forgotInput.value.trim();
        if (!identifier) return;

        forgotSubmit.disabled = true;
        forgotStatus.textContent = "Sending reset link…";
        try {
          forgotStatus.textContent = await auth.requestPasswordReset(identifier);
          forgotDone.hidden = false;
          forgotSubmit.hidden = true;
          forgotCancel.hidden = true;
        } catch (error) {
          forgotStatus.textContent = error.message || "Password reset is temporarily unavailable. Please try again.";
        } finally {
          forgotSubmit.disabled = false;
        }
      });

      var ROLE_PLACEHOLDERS = {
        "client":       "Enter your username",
        "farm_manager": "Farm Manager username",
        "admin":        "Super Admin username"
      };

      function clearLoginFields() {
        usernameInput.value = "";
        passwordInput.value = "";
        passwordInput.type = "password";
        btnEye.setAttribute("aria-label", "Show password");
        document.getElementById("error-message").style.display = "none";
      }

      // ── Role tab switching ──────────────────────────────────────
      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          clearLoginFields();
          tabs.forEach(function (t) {
            t.classList.remove("active");
            t.setAttribute("aria-selected", "false");
          });
          tab.classList.add("active");
          tab.setAttribute("aria-selected", "true");
          selectedRole = tab.dataset.role;
          if (selectedRole === "client") {
            if (forgotLink.parentNode) formOptions.removeChild(forgotLink);
          } else if (!forgotLink.parentNode) {
            formOptions.appendChild(forgotLink);
          }
          usernameInput.placeholder = ROLE_PLACEHOLDERS[selectedRole] || "Enter your username";
          btnSuperAdmin.classList.remove("admin-active");
        });
      });

      // ── Super Admin access toggle ───────────────────────────────
      btnSuperAdmin.addEventListener("click", function () {
        clearLoginFields();
        if (selectedRole === "admin") {
          // Deactivate — switch back to client
          selectedRole = "client";
          if (forgotLink.parentNode) formOptions.removeChild(forgotLink);
          tabs.forEach(function (t) { t.classList.remove("active"); t.setAttribute("aria-selected", "false"); });
          document.getElementById("tab-client").classList.add("active");
          document.getElementById("tab-client").setAttribute("aria-selected", "true");
          usernameInput.placeholder = ROLE_PLACEHOLDERS["client"];
          btnSuperAdmin.classList.remove("admin-active");
        } else {
          // Activate admin mode
          tabs.forEach(function (t) { t.classList.remove("active"); t.setAttribute("aria-selected", "false"); });
          selectedRole = "admin";
          if (!forgotLink.parentNode) formOptions.appendChild(forgotLink);
          usernameInput.placeholder = ROLE_PLACEHOLDERS["admin"];
          btnSuperAdmin.classList.add("admin-active");
        }
      });

      // ── Password visibility toggle ──────────────────────────────
      btnEye.addEventListener("click", function () {
        var isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        btnEye.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      });

      // ── Form submission ─────────────────────────────────────────
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var username = usernameInput.value.trim();
        var password = passwordInput.value;
        if (!username || !password) return;
        auth.login(username, password, rememberInput.checked, selectedRole);
      });
    })();
  </script>
</body>

</html>
